{% extends "base.html" %}
{% block title %}执行历史{% endblock %}
{% block content %}
<div x-data="historyList()" x-init="init()">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-bold">执行历史</h1>
        <a href="/" class="text-sm text-blue-600 hover:underline">← 返回执行器</a>
    </div>
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="text-left text-gray-500 bg-gray-50">
                <tr>
                    <th class="px-4 py-2">ID</th>
                    <th class="px-4 py-2">语言</th>
                    <th class="px-4 py-2">代码预览</th>
                    <th class="px-4 py-2">退出码</th>
                    <th class="px-4 py-2">耗时</th>
                    <th class="px-4 py-2">时间</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="item in items" :key="item.id">
                    <tr class="border-t hover:bg-gray-50 cursor-pointer" @click="window.location.href='/history/' + item.id">
                        <td class="px-4 py-2" x-text="item.id"></td>
                        <td class="px-4 py-2">
                            <span class="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700" x-text="item.language"></span>
                        </td>
                        <td class="px-4 py-2 font-mono text-xs text-gray-600 max-w-xs truncate" x-text="item.code"></td>
                        <td class="px-4 py-2">
                            <span class="text-xs" :class="item.exitCode === 0 ? 'text-green-600' : 'text-red-600'" x-text="item.exitCode"></span>
                        </td>
                        <td class="px-4 py-2 text-gray-500" x-text="item.durationMs + 'ms'"></td>
                        <td class="px-4 py-2 text-gray-500" x-text="new Date(item.createdAt).toLocaleString()"></td>
                    </tr>
                </template>
                <tr x-show="items.length === 0">
                    <td colspan="6" class="px-4 py-8 text-center text-gray-400">暂无执行记录</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function historyList() {
    return {
        items: [],
        async init() {
            const resp = await fetch('/api/execute/history?limit=50');
            this.items = await resp.json();
        }
    };
}
</script>
{% endblock %}
