{% extends "base.html" %}
{% block title %}模板渲染{% endblock %}
{% block content %}
<div x-data="renderTest()">
    <h1 class="text-xl font-bold mb-4">模板渲染</h1>
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">资产 ID</label>
                <input x-model="assetId" type="text" class="w-full border rounded px-3 py-2 text-sm" placeholder="输入资产 ID">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">变量 (JSON)</label>
                <textarea x-model="variables" rows="5" class="w-full border rounded px-3 py-2 text-sm font-mono" placeholder='{"name": "foo", "version": "1.0"}'></textarea>
            </div>
            <button @click="render()" :disabled="loading" class="bg-blue-500 text-white px-4 py-2 rounded text-sm">渲染</button>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-4" x-show="result">
        <h2 class="font-semibold mb-2">渲染结果</h2>
        <pre class="bg-gray-900 text-gray-100 p-4 rounded text-sm overflow-auto max-h-96" x-text="result"></pre>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function renderTest() {
    return {
        assetId: '', variables: '{}', result: '', loading: false,
        async render() {
            this.loading = true;
            try {
                const vars = JSON.parse(this.variables || '{}');
                const resp = await fetch('/api/assets/render', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: this.assetId, variables: vars })
                });
                const data = await resp.json();
                this.result = data.rendered || data.detail || '渲染失败';
            } catch (e) {
                this.result = '错误: ' + e.message;
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
{% endblock %}
