{% extends "base.html" %}
{% block title %}项目绑定管理 — Knowledge Tool{% endblock %}

{% block content %}
<div x-data="projectBindings()" x-init="init()" class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-lg shadow p-6 mb-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-xl font-bold">🔗 项目 — 知识库绑定</h1>
            <div class="flex gap-2">
                <button @click="openAddBinding()" class="text-sm px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    + 添加绑定
                </button>
            </div>
        </div>

        <!-- Project Selector -->
        <div class="flex items-center gap-3">
            <label class="text-sm font-medium text-gray-700">项目:</label>
            <input x-model="projectId"
                   @keydown.enter="loadBindings()"
                   class="flex-1 max-w-xs px-3 py-1.5 border rounded text-sm"
                   placeholder="输入项目ID (如 my-erp-system)">
            <button @click="loadBindings()" class="px-4 py-1.5 bg-gray-800 text-white rounded text-sm hover:bg-gray-900">查询</button>
            <button @click="autoMatch()" x-show="projectId" class="px-4 py-1.5 bg-green-600 text-white rounded text-sm hover:bg-green-700">
                🔍 自动匹配框架
            </button>
        </div>
    </div>

    <!-- Results -->
    <div x-show="loaded && (!bindings || bindings.length === 0)" class="bg-white rounded-lg shadow p-8 text-center text-gray-400">
        <p x-show="projectId">该项目暂无知识库绑定</p>
        <p x-show="!projectId">输入项目ID后查询</p>
    </div>

    <div x-show="bindings && bindings.length > 0" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50">
                <tr class="text-left text-gray-600">
                    <th class="px-4 py-3">知识库</th>
                    <th class="px-4 py-3">级别</th>
                    <th class="px-4 py-3">绑定类型</th>
                    <th class="px-4 py-3">优先级</th>
                    <th class="px-4 py-3">文档数</th>
                    <th class="px-4 py-3">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="b in (bindings || [])" :key="b?.id">
                    <tr class="border-t hover:bg-gray-50" :class="bindingRowClass(b?.binding_type)" x-show="b">
                        <td class="px-4 py-3">
                            <a :href="'/knowledge-bases/' + (b?.knowledge_base_id || '')" class="text-blue-600 hover:underline" x-text="b?.kb_name || '-'"></a>
                            <div class="text-xs text-gray-400" x-text="'#' + (b?.kb_slug || '-')" ></div>
                        </td>
                        <td class="px-4 py-3">
                            <span class="inline-block px-2 py-0.5 rounded text-xs font-bold uppercase"
                                  :class="levelBadgeClass(b?.kb_level)" x-text="b?.kb_level || '-'"></span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="text-xs px-1.5 py-0.5 rounded" :class="bindingClass(b?.binding_type)" x-text="b?.binding_type || '-'"></span>
                        </td>
                        <td class="px-4 py-3"><span class="font-mono" x-text="b?.priority || 0"></span></td>
                        <td class="px-4 py-3" x-text="b?.document_count || 0"></td>
                        <td class="px-4 py-3">
                            <button @click="b?.id && deleteBinding(b.id)" class="text-red-500 hover:text-red-700 text-xs">解除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Quick Stats -->
    <div x-show="bindings && bindings.length > 0" class="grid grid-cols-4 gap-3 mt-4">
        <div class="bg-white rounded-lg shadow p-3 text-center">
            <div class="text-lg font-bold text-blue-600" x-text="bindings?.length || 0"></div>
            <div class="text-xs text-gray-500">总绑定数</div>
        </div>
        <div class="bg-white rounded-lg shadow p-3 text-center">
            <div class="text-lg font-bold text-green-600" x-text="typeCount('explicit')"></div>
            <div class="text-xs text-gray-500">显式绑定</div>
        </div>
        <div class="bg-white rounded-lg shadow p-3 text-center">
            <div class="text-lg font-bold text-indigo-600" x-text="typeCount('inherited')"></div>
            <div class="text-xs text-gray-500">继承绑定</div>
        </div>
        <div class="bg-white rounded-lg shadow p-3 text-center">
            <div class="text-lg font-bold text-gray-600" x-text="typeCount('auto_matched')"></div>
            <div class="text-xs text-gray-500">自动匹配</div>
        </div>
    </div>

    <!-- Add Binding Modal -->
    <div x-show="addOpen" class="fixed inset-0 bg-black/30 flex items-center justify-center z-50" @click.self="addOpen = false">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4" @click.stop>
            <h2 class="text-lg font-bold mb-4">添加绑定</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">知识库</label>
                    <select x-model="addForm.knowledge_base_id" class="w-full px-3 py-2 border rounded text-sm">
                        <option value="">选择知识库...</option>
                        <template x-for="kb in allKBs" :key="kb.id">
                            <option :value="kb.id" x-text="kb.name + ' (' + kb.kb_level + ')'"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">绑定类型</label>
                    <select x-model="addForm.binding_type" class="w-full px-3 py-2 border rounded text-sm">
                        <option value="explicit">explicit (显式)</option>
                        <option value="inherited">inherited (继承)</option>
                        <option value="auto_matched">auto_matched (自动)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">优先级</label>
                    <input type="number" x-model="addForm.priority" class="w-full px-3 py-2 border rounded text-sm" placeholder="0-100">
                </div>
            </div>
            <div class="flex justify-start mt-3 text-xs text-gray-400">
                <span>提示: 项目ID = "<span x-text="projectId" class="font-mono"></span>"</span>
            </div>
            <div class="flex justify-end gap-3 mt-4">
                <button @click="addOpen = false" class="px-4 py-2 border rounded text-sm">取消</button>
                <button @click="createBinding()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm" :disabled="adding">
                    <span x-show="!adding">确定</span><span x-show="adding">...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Auto Match Result Toast -->
    <div x-show="autoResult?.total !== undefined" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-lg p-4 max-w-sm z-50 border-l-4 border-green-500">
        <div class="flex items-center gap-2 mb-2">
            <span class="text-green-600 text-lg">✓</span>
            <span class="font-semibold" x-text="'匹配到 ' + (autoResult?.total || 0) + ' 个框架知识库'"></span>
            <button @click="autoResult = null" class="ml-auto text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <div class="text-xs text-gray-600 space-y-1">
            <template x-for="m in (autoResult?.matched || [])" :key="m?.kb_id">
                <div class="flex justify-between" x-show="m">
                    <span x-text="m?.kb_name || '-'"></span>
                    <span class="text-gray-400" x-text="(m?.overlap_tech || [])?.join?.(', ') || ''"></span>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function projectBindings() {
    return {
        projectId: '',
        bindings: [], allKBs: [], loaded: false,
        addOpen: false, adding: false,
        autoResult: { total: 0, matched: [] },
        addForm: { knowledge_base_id: '', binding_type: 'explicit', priority: 0 },

        async init() {
            try {
                const r = await fetch('/api/knowledge-bases');
                const d = await r.json();
                this.allKBs = d.data?.items || [];
            } catch (e) { console.error(e); }
        },

        async loadBindings() {
            if (!this.projectId) return;
            try {
                const r = await fetch(`/api/projects/${this.projectId}/knowledge-bases`);
                const d = await r.json();
                this.bindings = d.data?.items || [];
            } catch (e) { console.error(e); }
            this.loaded = true;
        },

        typeCount(t) { return (this.bindings || []).filter(b => b?.binding_type === t).length; },

        levelBadgeClass(level) {
            if (!level) return 'bg-gray-100 text-gray-700';
            if (level === 'framework') return 'bg-purple-100 text-purple-700';
            if (level === 'template') return 'bg-indigo-100 text-indigo-700';
            return 'bg-teal-100 text-teal-700';
        },
        bindingClass(t) {
            if (!t) return 'bg-gray-100 text-gray-600';
            if (t === 'explicit') return 'bg-green-100 text-green-700';
            if (t === 'inherited') return 'bg-blue-100 text-blue-700';
            return 'bg-gray-100 text-gray-600';
        },
        bindingRowClass(t) {
            if (t === 'explicit') return 'border-l-2 border-l-green-400';
            return '';
        },

        openAddBinding() {
            if (!this.projectId) { alert('请先输入项目ID'); return; }
            this.addForm = { knowledge_base_id: '', binding_type: 'explicit', priority: 0 };
            this.addOpen = true;
        },

        async createBinding() {
            if (!this.addForm.knowledge_base_id) { alert('请选择知识库'); return; }
            this.adding = true;
            try {
                await fetch('/api/projects/bindings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: this.projectId,
                        knowledge_base_id: this.addForm.knowledge_base_id,
                        binding_type: this.addForm.binding_type,
                        priority: parseInt(this.addForm.priority) || 0,
                    }),
                });
                this.addOpen = false;
                await this.loadBindings();
            } catch (e) { console.error(e); }
            this.adding = false;
        },

        async autoMatch() {
            try {
                const r = await fetch(`/api/projects/${this.projectId}/auto-match`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tech_stack: [],
                        domains: [],
                    }),
                });
                const d = await r.json();
                this.autoResult = d.data || { total: 0, matched: [] };
                if (this.autoResult.total > 0) await this.loadBindings();
            } catch (e) { console.error(e); }
        },

        async deleteBinding(id) {
            if (!confirm('解除绑定？')) return;
            try {
                await fetch(`/api/projects/bindings/${id}`, { method: 'DELETE' });
                this.bindings = this.bindings.filter(b => b.id !== id);
            } catch (e) { console.error(e); }
        },
    };
}
</script>
{% endblock %}
