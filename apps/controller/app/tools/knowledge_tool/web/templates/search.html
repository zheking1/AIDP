{% extends "base.html" %}
{% block title %}高级搜索中心{% endblock %}
{% block content %}
<div x-data="searchCenter()" x-init="init()">
    <!-- Search Header -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-4">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            高级搜索中心
        </h1>
        
        <!-- Main Search Bar -->
        <div class="relative mb-4">
            <input 
                x-model="query" 
                @keydown.enter="search()"
                type="text" 
                class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 pl-12 text-lg focus:outline-none focus:border-blue-500 transition-colors"
                placeholder="输入搜索关键词，支持自然语言查询..."
            >
            <svg class="w-6 h-6 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <button 
                @click="search()"
                :disabled="loading || !query.trim()"
                class="absolute right-2 top-2 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 text-white px-6 py-1.5 rounded-md font-medium transition-colors"
            >
                <span x-show="!loading">搜索</span>
                <span x-show="loading">搜索中...</span>
            </button>
        </div>

        <!-- Search Mode Tabs -->
        <div class="flex items-center gap-2 mb-4 border-b">
            <button 
                @click="searchMode = 'hybrid'"
                :class="searchMode === 'hybrid' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500'"
                class="px-4 py-2 font-medium hover:text-blue-600 transition-colors flex items-center gap-1"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                混合搜索
            </button>
            <button 
                @click="searchMode = 'semantic'"
                :class="searchMode === 'semantic' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500'"
                class="px-4 py-2 font-medium hover:text-blue-600 transition-colors flex items-center gap-1"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                语义搜索
            </button>
            <button 
                @click="searchMode = 'keyword'"
                :class="searchMode === 'keyword' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500'"
                class="px-4 py-2 font-medium hover:text-blue-600 transition-colors flex items-center gap-1"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                关键词搜索
            </button>
        </div>

        <!-- Advanced Filters -->
        <div class="grid grid-cols-4 gap-3">
            <div>
                <label class="block text-xs text-gray-500 mb-1">知识库</label>
                <select x-model="filters.kb_id" class="w-full border rounded px-2 py-1.5 text-sm">
                    <option value="">全部知识库</option>
                    <template x-for="kb in knowledgeBases" :key="kb.id">
                        <option :value="kb.id" x-text="kb.name"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">文档类型</label>
                <select x-model="filters.doc_type" class="w-full border rounded px-2 py-1.5 text-sm">
                    <option value="">全部类型</option>
                    <option value="markdown">Markdown</option>
                    <option value="text">文本</option>
                    <option value="pdf">PDF</option>
                    <option value="word">Word</option>
                    <option value="code">代码</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">结果数量</label>
                <select x-model="filters.top_k" class="w-full border rounded px-2 py-1.5 text-sm">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">最小相似度</label>
                <input x-model="filters.min_score" type="number" step="0.05" min="0" max="1"
                       class="w-full border rounded px-2 py-1.5 text-sm" placeholder="0.1">
            </div>
        </div>
    </div>

    <!-- Search Stats -->
    <div x-show="searched" class="bg-blue-50 rounded-lg p-3 mb-4 flex items-center justify-between">
        <div class="flex items-center gap-4 text-sm">
            <span>找到 <strong class="text-blue-600" x-text="results.length"></strong> 个结果</span>
            <span x-show="searchTime > 0" class="text-gray-500">耗时 <span x-text="searchTime"></span>ms</span>
            <span x-show="matchedKbs.length > 0" class="flex items-center gap-1">
                匹配知识库:
                <template x-for="kb in matchedKbs" :key="kb">
                    <span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs" x-text="kb.substring(0, 8)"></span>
                </template>
            </span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-500">排序:</span>
            <select x-model="sortBy" @change="sortResults()" class="text-sm border rounded px-2 py-1">
                <option value="relevance">相关度</option>
                <option value="date">日期</option>
            </select>
        </div>
    </div>

    <!-- Results -->
    <div x-show="results.length > 0" class="space-y-3">
        <template x-for="(item, index) in results" :key="index">
            <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
                <!-- Result Header -->
                <div class="flex items-start justify-between mb-2">
                    <div class="flex-1">
                        <a :href="'/documents/' + item.document_id" 
                           class="text-lg text-blue-600 hover:underline font-medium"
                           x-text="item.title || '无标题'"></a>
                        <div class="flex items-center gap-2 mt-1 text-xs text-gray-500">
                            <span x-show="item.kb_name" class="px-1.5 py-0.5 bg-gray-100 rounded" x-text="item.kb_name"></span>
                            <span x-show="item.doc_type" class="px-1.5 py-0.5 bg-gray-100 rounded" x-text="item.doc_type"></span>
                            <span x-show="item.score" class="text-blue-600 font-medium" x-text="'相似度: ' + (item.score * 100).toFixed(1) + '%'"></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button @click="viewChunk(item)" class="text-gray-400 hover:text-blue-600 p-1" title="查看详情">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Content Preview -->
                <div class="text-sm text-gray-700 mb-2">
                    <p class="line-clamp-3" x-html="highlightText(item.content, query)"></p>
                </div>

                <!-- Meta Info -->
                <div class="flex items-center gap-4 text-xs text-gray-500">
                    <span x-show="item.heading_path && item.heading_path.length" 
                          class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                        <span x-text="item.heading_path.join(' > ')"></span>
                    </span>
                    <span x-show="item.chunk_index !== undefined" 
                          class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        分块 #<span x-text="item.chunk_index"></span>
                    </span>
                    <span x-show="item.source_start_line" 
                          class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        L<span x-text="item.source_start_line"></span>-<span x-text="item.source_end_line"></span>
                    </span>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="searched && results.length === 0 && !loading" class="text-center py-12">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <p class="text-gray-500 text-lg">未找到匹配结果</p>
        <p class="text-gray-400 text-sm mt-1">尝试调整搜索关键词或筛选条件</p>
    </div>

    <!-- Chunk Detail Modal -->
    <div x-show="selectedChunk" 
         class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
         x-transition.opacity>
        <div class="bg-white rounded-lg shadow-xl max-w-3xl w-full max-h-[80vh] overflow-hidden" @click.away="selectedChunk = null">
            <div class="flex items-center justify-between p-4 border-b">
                <h3 class="font-semibold flex items-center gap-2">
                    <span x-text="selectedChunk?.title || '分块详情'"></span>
                    <span x-show="selectedChunk?.chunk_index !== undefined" 
                          class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-sm"
                          x-text="`#${selectedChunk?.chunk_index}`"></span>
                </h3>
                <button @click="selectedChunk = null" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-auto max-h-[60vh]">
                <div class="mb-4 text-sm text-gray-600 flex flex-wrap gap-2">
                    <span x-show="selectedChunk?.kb_name" class="px-2 py-0.5 bg-gray-100 rounded" x-text="selectedChunk?.kb_name"></span>
                    <span x-show="selectedChunk?.score" class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded" x-text="`相似度: ${(selectedChunk?.score * 100).toFixed(1)}%`"></span>
                    <span x-show="selectedChunk?.heading_path?.length" x-text="selectedChunk?.heading_path?.join(' > ')"></span>
                </div>
                <pre class="text-sm bg-gray-50 p-4 rounded overflow-auto whitespace-pre-wrap"><code x-text="selectedChunk?.content"></code></pre>
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-2">
                <a :href="'/documents/' + selectedChunk?.document_id" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
                    查看文档
                </a>
                <button @click="selectedChunk = null" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm">
                    关闭
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function searchCenter() {
    return {
        query: '',
        searchMode: 'hybrid',
        loading: false,
        searched: false,
        results: [],
        searchTime: 0,
        matchedKbs: [],
        knowledgeBases: [],
        sortBy: 'relevance',
        selectedChunk: null,
        filters: {
            kb_id: '',
            doc_type: '',
            top_k: 10,
            min_score: 0.1
        },

        async init() {
            await this.loadKnowledgeBases();
        },

        async loadKnowledgeBases() {
            try {
                const resp = await fetch('/api/knowledge-bases');
                if (resp.ok) {
                    const result = await resp.json();
                    this.knowledgeBases = result.data || result.items || [];
                }
            } catch (e) {
                console.error('Failed to load knowledge bases:', e);
            }
        },

        async search() {
            if (!this.query.trim()) return;
            
            this.loading = true;
            this.searched = true;
            const startTime = Date.now();

            try {
                let endpoint = '/api/knowledge/search';
                let body = {
                    query: this.query,
                    top_k: parseInt(this.filters.top_k),
                    min_score: parseFloat(this.filters.min_score) || 0,
                    include_content: true
                };

                // Apply filters
                if (this.filters.kb_id) {
                    body.knowledge_base_ids = [this.filters.kb_id];
                }

                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();
                this.results = data.data?.items || data.items || [];
                this.matchedKbs = data.data?.matched_kb_ids || [];
                this.searchTime = Date.now() - startTime;

                // Sort results
                this.sortResults();
            } catch (e) {
                console.error('Search failed:', e);
                alert('搜索失败: ' + e.message);
            } finally {
                this.loading = false;
            }
        },

        sortResults() {
            if (this.sortBy === 'relevance') {
                this.results.sort((a, b) => (b.score || 0) - (a.score || 0));
            } else if (this.sortBy === 'date') {
                this.results.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            }
        },

        highlightText(text, query) {
            if (!text || !query) return text;
            const terms = query.trim().split(/\s+/);
            let highlighted = text;
            terms.forEach(term => {
                const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                highlighted = highlighted.replace(regex, '<mark class="bg-yellow-200 px-0.5 rounded">$1</mark>');
            });
            return highlighted;
        },

        viewChunk(item) {
            this.selectedChunk = item;
        }
    };
}
</script>
{% endblock %}
