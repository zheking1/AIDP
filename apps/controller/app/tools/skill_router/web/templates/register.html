<!DOCTYPE html>
<html lang="{{ lang or 'zh' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _('SkillRouter - Register') }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
  <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96 border border-gray-700">
    <div class="flex justify-end gap-2 mb-4">
      <a href="/lang/en" class="text-xs px-2 py-1 rounded {% if lang == 'en' %}bg-indigo-600 text-white{% else %}text-gray-400 hover:text-white{% endif %}">EN</a>
      <a href="/lang/zh" class="text-xs px-2 py-1 rounded {% if lang == 'zh' %}bg-indigo-600 text-white{% else %}text-gray-400 hover:text-white{% endif %}">中</a>
    </div>
    <h1 class="text-2xl font-bold text-indigo-400 text-center mb-2">{{ _('Create Account') }}</h1>
    {% if error %}
    <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-2 rounded mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{ _('Username') }}</label>
        <input type="text" name="username" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">{{ _('Password') }}</label>
        <input type="password" name="password" required minlength="6" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded font-medium">{{ _('Register') }}</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">{{ _('Already have an account?') }} <a href="/login" class="text-indigo-400 hover:underline">{{ _('Login') }}</a></p>
  </div>
</body>
</html>
