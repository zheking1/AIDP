{% extends "base.html" %}

{% block content %}
<div x-data="logsManager()" x-init="init()">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">调用日志</h2>
    
    <!-- Filters -->
    <div class="bg-white rounded-lg shadow p-4 mb-6">
        <div class="flex gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-gray-700">工具</label>
                <select x-model="filter.tool" @change="loadLogs()" class="mt-1 block border rounded-md px-3 py-2">
                    <option value="">全部</option>
                    <template x-for="tool in toolNames" :key="tool">
                        <option :value="tool" x-text="tool"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">数量</label>
                <select x-model="filter.limit" @change="loadLogs()" class="mt-1 block border rounded-md px-3 py-2">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <button @click="loadLogs()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">刷新</button>
        </div>
    </div>
    
    <!-- Logs Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">工具</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">能力</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">耗时</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">时间</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="log in logs" :key="log.id">
                    <tr>
                        <td class="px-4 py-3 text-sm text-gray-500" x-text="log.id"></td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800" x-text="log.toolName"></span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-600 font-mono" x-text="log.capability"></td>
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                  :class="{
                                      'bg-green-100 text-green-800': log.status === 'success',
                                      'bg-red-100 text-red-800': log.status === 'error'
                                  }"
                                  x-text="log.status"></span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-500" x-text="log.durationMs + 'ms'"></td>
                        <td class="px-4 py-3 text-sm text-gray-500" x-text="formatTime(log.createdAt)"></td>
                        <td class="px-4 py-3 text-sm">
                            <button @click="selectedLog = log; showDetail = true" class="text-blue-600 hover:text-blue-800">详情</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="logs.length === 0">
                    <td colspan="7" class="px-6 py-12 text-center text-gray-500">暂无调用记录</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Detail Modal -->
    <div x-show="showDetail" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 max-h-[80vh] overflow-auto">
            <h3 class="text-lg font-bold mb-4">调用详情</h3>
            <div class="space-y-4">
                <div>
                    <div class="text-sm font-medium text-gray-500">工具</div>
                    <div class="text-gray-900" x-text="selectedLog?.toolName"></div>
                </div>
                <div>
                    <div class="text-sm font-medium text-gray-500">能力</div>
                    <div class="text-gray-900 font-mono" x-text="selectedLog?.capability"></div>
                </div>
                <div>
                    <div class="text-sm font-medium text-gray-500">状态</div>
                    <div x-text="selectedLog?.status"></div>
                </div>
                <div>
                    <div class="text-sm font-medium text-gray-500">耗时</div>
                    <div class="text-gray-900" x-text="(selectedLog?.durationMs || 0) + 'ms'"></div>
                </div>
                <div x-show="selectedLog?.error">
                    <div class="text-sm font-medium text-gray-500">错误</div>
                    <pre class="text-red-600 text-sm bg-red-50 p-2 rounded" x-text="selectedLog?.error"></pre>
                </div>
            </div>
            <div class="flex justify-end mt-6">
                <button @click="showDetail = false" class="px-4 py-2 text-gray-600 hover:text-gray-800">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
function logsManager() {
    return {
        logs: [],
        toolNames: [],
        filter: { tool: '', limit: '20' },
        showDetail: false,
        selectedLog: null,
        
        async init() {
            await this.loadTools();
            await this.loadLogs();
        },
        
        async loadTools() {
            try {
                const resp = await fetch('/api/tools');
                const tools = await resp.json();
                this.toolNames = tools.map(t => t.name);
            } catch (e) {
                console.error('Failed to load tools:', e);
            }
        },
        
        async loadLogs() {
            try {
                let url = `/api/tools/invocations/history?limit=${this.filter.limit}`;
                if (this.filter.tool) {
                    url += `&tool_name=${this.filter.tool}`;
                }
                const resp = await fetch(url);
                this.logs = await resp.json();
            } catch (e) {
                console.error('Failed to load logs:', e);
            }
        },
        
        formatTime(isoString) {
            if (!isoString) return '-';
            const d = new Date(isoString);
            return d.toLocaleString('zh-CN');
        }
    };
}
</script>
{% endblock %}
