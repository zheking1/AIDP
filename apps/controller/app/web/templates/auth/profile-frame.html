<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #111827; color: #f3f4f6; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen">
<div class="p-6 max-w-2xl mx-auto" x-data="profileManager()" x-init="loadProfile()">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">个人资料</h1>
        <p class="text-gray-400 mt-1">管理您的个人信息</p>
    </div>

    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 bg-indigo-500/20 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-indigo-400 text-2xl"></i>
            </div>
            <div>
                <h2 class="text-lg font-semibold text-white" x-text="profile.nickname || profile.username || '用户'"></h2>
                <p class="text-sm text-gray-500" x-text="profile.role || 'user'"></p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">用户名</label>
                <input type="text" x-model="profile.username" disabled class="w-full px-3 py-2 bg-gray-700/50 border border-gray-600 rounded-lg text-gray-400 cursor-not-allowed">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">昵称</label>
                <input type="text" x-model="profile.nickname" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">邮箱</label>
                <input type="email" x-model="profile.email" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <div class="flex justify-end mt-6">
            <button @click="saveProfile()" :disabled="saving" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg font-medium transition">
                <i class="fas fa-save mr-2" :class="saving ? 'fa-spin' : ''"></i><span x-text="saving ? '保存中...' : '保存修改'"></span>
            </button>
        </div>
    </div>

    <script>
        function profileManager() {
            return {
                saving: false,
                profile: {
                    username: '',
                    nickname: '',
                    email: '',
                    role: ''
                },

                async loadProfile() {
                    try {
                        const response = await fetch('/api/auth/me');
                        if (response.ok) {
                            const data = await response.json();
                            this.profile = data.user || data;
                        }
                    } catch (e) {
                        console.error('Failed to load profile:', e);
                        // Demo data
                        this.profile = {
                            username: 'admin',
                            nickname: '',
                            email: '',
                            role: 'super_admin'
                        };
                    }
                },

                async saveProfile() {
                    this.saving = true;
                    try {
                        const response = await fetch('/api/auth/profile', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                nickname: this.profile.nickname,
                                email: this.profile.email
                            })
                        });
                        
                        if (response.ok) {
                            alert('资料已更新');
                        } else {
                            alert('保存失败');
                        }
                    } catch (e) {
                        console.error('Failed to save profile:', e);
                        alert('保存失败: ' + e.message);
                    } finally {
                        this.saving = false;
                    }
                }
            }
        }
    </script>
</div>
</body>
</html>
