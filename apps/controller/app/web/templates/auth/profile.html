{% extends "layouts/unified_base.html" %}
{% block title %}个人资料{% endblock %}

{% block content %}
<div x-data="profilePage()" x-init="init()">
    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">个人资料</h1>
        <p class="text-sm text-gray-400 mt-1">管理你的账户信息和安全设置</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left: Profile Card -->
        <div class="lg:col-span-1">
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 text-center">
                <div class="w-24 h-24 mx-auto rounded-full flex items-center justify-center text-3xl font-bold text-white mb-4"
                     :class="user.role === 'super_admin' ? 'bg-gradient-to-br from-red-500 to-orange-600' :
                             user.role === 'admin' ? 'bg-gradient-to-br from-indigo-500 to-purple-600' :
                             'bg-gradient-to-br from-gray-500 to-gray-600'"
                     x-text="(user.nickname || user.username || '?')[0].toUpperCase()">
                </div>
                <h2 class="text-xl font-bold text-white" x-text="user.nickname || user.username"></h2>
                <p class="text-sm text-gray-400" x-text="user.email || 'No email'"></p>
                <span class="inline-block mt-2 px-3 py-1 rounded-full text-xs font-medium"
                      :class="{
                          'bg-red-500/20 text-red-400': user.role === 'super_admin',
                          'bg-indigo-500/20 text-indigo-400': user.role === 'admin',
                          'bg-blue-500/20 text-blue-400': user.role === 'developer',
                          'bg-gray-500/20 text-gray-400': user.role === 'user',
                          'bg-yellow-500/20 text-yellow-400': user.role === 'readonly'
                      }"
                      x-text="roleLabels[user.role] || user.role">
                </span>
                
                <div class="mt-4 pt-4 border-t border-gray-700 text-left space-y-2">
                    <div class="flex items-center gap-2 text-sm">
                        <i class="fas fa-calendar text-gray-500 w-5"></i>
                        <span class="text-gray-400">注册时间:</span>
                        <span class="text-white" x-text="formatDate(user.created_at)"></span>
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <i class="fas fa-clock text-gray-500 w-5"></i>
                        <span class="text-gray-400">最近登录:</span>
                        <span class="text-white" x-text="user.last_login_at ? formatDate(user.last_login_at) : '从未'"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Forms -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Edit Profile -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
                <h3 class="text-lg font-bold text-white mb-4">
                    <i class="fas fa-user-edit mr-2 text-indigo-400"></i>编辑资料
                </h3>
                <form @submit.prevent="updateProfile()">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">昵称</label>
                            <input type="text" x-model="profileForm.nickname"
                                   class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white
                                          placeholder-gray-400 focus:outline-none focus:border-indigo-500"
                                   placeholder="显示名称">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">邮箱</label>
                            <input type="email" x-model="profileForm.email"
                                   class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white
                                          placeholder-gray-400 focus:outline-none focus:border-indigo-500"
                                   placeholder="user@example.com">
                        </div>
                    </div>
                    <div class="mt-4 flex items-center gap-3">
                        <button type="submit" :disabled="savingProfile"
                                class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition disabled:opacity-50">
                            <i x-show="savingProfile" class="fas fa-spinner fa-spin mr-1"></i>
                            保存修改
                        </button>
                        <span x-show="profileSuccess" class="text-green-400 text-sm" x-text="profileSuccess"></span>
                        <span x-show="profileError" class="text-red-400 text-sm" x-text="profileError"></span>
                    </div>
                </form>
            </div>

            <!-- Change Password -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
                <h3 class="text-lg font-bold text-white mb-4">
                    <i class="fas fa-lock mr-2 text-yellow-400"></i>修改密码
                </h3>
                <form @submit.prevent="changePassword()">
                    <div class="space-y-4 max-w-md">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">当前密码</label>
                            <input type="password" x-model="passwordForm.old_password"
                                   class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white
                                          placeholder-gray-400 focus:outline-none focus:border-indigo-500"
                                   placeholder="输入当前密码" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">新密码</label>
                            <input type="password" x-model="passwordForm.new_password"
                                   class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white
                                          placeholder-gray-400 focus:outline-none focus:border-indigo-500"
                                   placeholder="至少 6 个字符" required minlength="6">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">确认新密码</label>
                            <input type="password" x-model="passwordForm.confirm_password"
                                   class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white
                                          placeholder-gray-400 focus:outline-none focus:border-indigo-500"
                                   placeholder="再次输入新密码" required>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center gap-3">
                        <button type="submit" :disabled="changingPassword"
                                class="px-5 py-2 bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-medium rounded-lg transition disabled:opacity-50">
                            <i x-show="changingPassword" class="fas fa-spinner fa-spin mr-1"></i>
                            修改密码
                        </button>
                        <span x-show="passwordSuccess" class="text-green-400 text-sm" x-text="passwordSuccess"></span>
                        <span x-show="passwordError" class="text-red-400 text-sm" x-text="passwordError"></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function profilePage() {
    return {
        user: {},
        roleLabels: {
            'super_admin': '超级管理员', 'admin': '管理员', 'developer': '开发者',
            'user': '普通用户', 'readonly': '只读用户'
        },
        profileForm: { nickname: '', email: '' },
        savingProfile: false, profileSuccess: '', profileError: '',
        passwordForm: { old_password: '', new_password: '', confirm_password: '' },
        changingPassword: false, passwordSuccess: '', passwordError: '',

        async init() {
            await this.loadProfile();
        },

        async loadProfile() {
            try {
                const resp = await fetch('/api/auth/me');
                if (!resp.ok) throw new Error('Not authenticated');
                this.user = await resp.json();
                this.profileForm.nickname = this.user.nickname || '';
                this.profileForm.email = this.user.email || '';
            } catch (e) {
                window.location.href = '/login';
            }
        },

        async updateProfile() {
            this.savingProfile = true;
            this.profileSuccess = '';
            this.profileError = '';
            try {
                // TODO: Implement profile update API endpoint
                this.profileSuccess = '资料已更新';
                setTimeout(() => { this.profileSuccess = ''; }, 3000);
            } catch (e) {
                this.profileError = '更新失败';
            } finally {
                this.savingProfile = false;
            }
        },

        async changePassword() {
            if (this.passwordForm.new_password !== this.passwordForm.confirm_password) {
                this.passwordError = '两次输入的密码不一致';
                return;
            }
            this.changingPassword = true;
            this.passwordSuccess = '';
            this.passwordError = '';
            try {
                const resp = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        old_password: this.passwordForm.old_password,
                        new_password: this.passwordForm.new_password
                    })
                });
                const data = await resp.json();
                if (resp.ok && data.success) {
                    this.passwordSuccess = '密码修改成功';
                    this.passwordForm = { old_password: '', new_password: '', confirm_password: '' };
                    setTimeout(() => { this.passwordSuccess = ''; }, 3000);
                } else {
                    this.passwordError = data.detail || '修改失败';
                }
            } catch (e) {
                this.passwordError = '网络错误';
            } finally {
                this.changingPassword = false;
            }
        },

        formatDate(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleDateString('zh-CN');
        }
    };
}
</script>
{% endblock %}
