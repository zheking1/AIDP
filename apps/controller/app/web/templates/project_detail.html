<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail - AIDP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-sm"><div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center"><span class="text-xl font-bold">AIDP</span><a href="/projects" class="text-indigo-600">&larr; Back</a></div></nav>
    <div class="max-w-4xl mx-auto py-6 px-4">
        <div id="detail" class="bg-white p-6 rounded-lg shadow mb-6"><div class="text-center py-8 text-gray-500">Loading...</div></div>
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-medium mb-4">Members</h2>
            <div id="membersList" class="space-y-2"><div class="text-center py-4 text-gray-500">Loading...</div></div>
        </div>
    </div>
    <script>
        const pid = new URLSearchParams(window.location.search).get('id') || {{ project_id }};
        async function load() {
            try {
                const r1 = await fetch(`/api/projects/${pid}`);
                const p = await r1.json();
                document.getElementById('detail').innerHTML = `<h1 class="text-2xl font-bold">${p.name}</h1><p class="text-gray-600 mt-2">${p.description || ''}</p><p class="text-gray-400 text-sm mt-1">Type: ${p.type || 'N/A'}</p>`;
                const r2 = await fetch(`/api/projects/${pid}/members`);
                const m = await r2.json();
                document.getElementById('membersList').innerHTML = m.members.map(m => `<div class="flex justify-between p-3 bg-gray-50 rounded"><span>User ID: ${m.user_id}</span><span class="text-sm text-gray-500">Role: ${m.role}</span></div>`).join('') || '<p class="text-gray-500">No members</p>';
            } catch(e) { document.getElementById('detail').innerHTML = '<p class="text-red-500">Failed to load</p>'; }
        }
        load();
    </script>
</body>
</html>
