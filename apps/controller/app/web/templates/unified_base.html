<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIDP Console{% endblock %} - AI DevOps Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background-color: rgba(99, 102, 241, 0.1); }
        .sidebar-item.active { background-color: rgba(99, 102, 241, 0.2); border-right: 3px solid #6366f1; }
        .tool-card { transition: all 0.2s; }
        .tool-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-healthy { background-color: #10b981; }
        .status-unhealthy { background-color: #ef4444; }
        .status-registered { background-color: #f59e0b; }
        .status-unreachable { background-color: #6b7280; }
        .status-disabled { background-color: #374151; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" x-data="unifiedApp()" x-init="init()">
    <!-- Top Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 fixed top-0 left-0 right-0 z-50 h-14">
        <div class="flex items-center justify-between h-full px-4">
            <!-- Left: Logo & Brand -->
            <div class="flex items-center gap-4">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-robot text-white text-sm"></i>
                    </div>
                    <span class="text-lg font-bold text-white">AIDP</span>
                    <span class="text-xs text-gray-500 hidden md:inline">AI DevOps Platform</span>
                </a>
                
                <!-- Quick Tool Switcher -->
                <div class="relative ml-6" x-data="{ open: false }">
                    <button @click="open = !open" @click.away="open = false" 
                            class="flex items-center gap-2 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition">
                        <i class="fas fa-tools text-gray-400"></i>
                        <span>工具</span>
                        <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                    </button>
                    <div x-show="open" x-cloak 
                         class="absolute top-full left-0 mt-2 w-64 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-50 max-h-96 overflow-y-auto">
                        <div class="p-2">
                            <a href="/tools" class="block px-3 py-2 text-sm text-gray-300 hover:bg-gray-700 rounded">
                                <i class="fas fa-th-large w-5"></i> 全部工具
                            </a>
                            <div class="border-t border-gray-700 my-2"></div>
                            <template x-for="tool in tools" :key="tool.name">
                                <a :href="'/tools/' + tool.name" 
                                   class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-gray-700 rounded">
                                    <span class="status-dot" :class="'status-' + tool.status"></span>
                                    <span x-text="tool.displayName || tool.name" class="text-gray-200"></span>
                                </a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right: User & Actions -->
            <div class="flex items-center gap-4">
                <!-- Global Search -->
                <div class="relative hidden md:block">
                    <input type="text" placeholder="搜索工具、项目..." 
                           class="w-64 px-3 py-1.5 bg-gray-700 border border-gray-600 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                </div>
                
                <!-- Health Status -->
                <div class="flex items-center gap-2 px-3 py-1 bg-gray-700 rounded-lg">
                    <span class="text-xs text-gray-400">健康</span>
                    <span class="text-sm font-medium" 
                          :class="healthyCount === tools.length ? 'text-green-400' : 'text-yellow-400'"
                          x-text="healthyCount + '/' + tools.length"></span>
                </div>
                
                <!-- User Menu -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" @click.away="open = false"
                            class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-700 rounded-lg transition">
                        <div class="w-7 h-7 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold">
                            {{ username[0]|upper if username else 'U' }}
                        </div>
                        <span class="text-sm">{{ username }}</span>
                    </button>
                    <div x-show="open" x-cloak
                         class="absolute top-full right-0 mt-2 w-48 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-50">
                        <div class="p-2">
                            <div class="px-3 py-2 text-xs text-gray-500 border-b border-gray-700">
                                角色: {{ role }}
                            </div>
                            <a href="/configs" class="block px-3 py-2 text-sm text-gray-300 hover:bg-gray-700 rounded">
                                <i class="fas fa-cog w-5"></i> 设置
                            </a>
                            <form action="/api/auth/logout" method="POST">
                                <button type="submit" class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-gray-700 rounded">
                                    <i class="fas fa-sign-out-alt w-5"></i> 退出
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar & Main Content -->
    <div class="flex pt-14 min-h-screen">
        <!-- Sidebar -->
        <aside class="w-56 bg-gray-800 border-r border-gray-700 fixed left-0 top-14 bottom-0 overflow-y-auto">
            <nav class="p-3 space-y-1">
                <!-- Dashboard -->
                <a href="/" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-home w-5 text-center {% if active_page == 'dashboard' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'dashboard' %}text-white font-medium{% else %}text-gray-300{% endif %}">总览</span>
                </a>
                
                <!-- Tools Section -->
                <div class="mt-6 mb-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    工具
                </div>
                <a href="/tools" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'tools' %}active{% endif %}">
                    <i class="fas fa-th-large w-5 text-center {% if active_page == 'tools' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'tools' %}text-white font-medium{% else %}text-gray-300{% endif %}">全部工具</span>
                    <span class="ml-auto text-xs bg-gray-700 px-2 py-0.5 rounded" x-text="tools.length"></span>
                </a>
                
                <!-- Dynamic Tool List -->
                <template x-for="tool in tools.slice(0, 8)" :key="tool.name">
                    <a :href="'/tools/' + tool.name" 
                       class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-lg"
                       :class="currentTool === tool.name ? 'active' : ''">
                        <span class="status-dot" :class="'status-' + tool.status"></span>
                        <span class="text-sm truncate" 
                              :class="currentTool === tool.name ? 'text-white font-medium' : 'text-gray-400'"
                              x-text="tool.displayName || tool.name"></span>
                    </a>
                </template>
                <div x-show="tools.length > 8" class="px-3 py-1 text-xs text-gray-500">
                    还有 <span x-text="tools.length - 8"></span> 个工具...
                </div>
                
                <!-- Management Section -->
                <div class="mt-6 mb-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    管理
                </div>
                <a href="/projects" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'projects' %}active{% endif %}">
                    <i class="fas fa-folder w-5 text-center {% if active_page == 'projects' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'projects' %}text-white font-medium{% else %}text-gray-300{% endif %}">项目</span>
                </a>
                <a href="/logs" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'logs' %}active{% endif %}">
                    <i class="fas fa-terminal w-5 text-center {% if active_page == 'logs' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'logs' %}text-white font-medium{% else %}text-gray-300{% endif %}">日志</span>
                </a>
                <a href="/audit" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'audit' %}active{% endif %}">
                    <i class="fas fa-shield-alt w-5 text-center {% if active_page == 'audit' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'audit' %}text-white font-medium{% else %}text-gray-300{% endif %}">审计</span>
                </a>
                <a href="/reviews" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'reviews' %}active{% endif %}">
                    <i class="fas fa-check-circle w-5 text-center {% if active_page == 'reviews' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'reviews' %}text-white font-medium{% else %}text-gray-300{% endif %}">评审</span>
                </a>
                
                <!-- Settings Section -->
                <div class="mt-6 mb-2 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    系统
                </div>
                <a href="/configs" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg {% if active_page == 'configs' %}active{% endif %}">
                    <i class="fas fa-cog w-5 text-center {% if active_page == 'configs' %}text-indigo-400{% else %}text-gray-400{% endif %}"></i>
                    <span class="{% if active_page == 'configs' %}text-white font-medium{% else %}text-gray-300{% endif %}">配置</span>
                </a>
                <a href="/docs" target="_blank" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg">
                    <i class="fas fa-book w-5 text-center text-gray-400"></i>
                    <span class="text-gray-300">API 文档</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-56 p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function unifiedApp() {
            return {
                tools: [],
                currentTool: '',
                healthyCount: 0,
                loading: true,
                async init() {
                    await this.loadTools();
                    // Extract current tool from URL
                    const match = window.location.pathname.match(/\/tools\/([^\/]+)/);
                    if (match) {
                        this.currentTool = match[1];
                    }
                    this.loading = false;
                    // Auto refresh health every 30s
                    setInterval(() => this.refreshHealth(), 30000);
                },
                async loadTools() {
                    try {
                        const r = await fetch('/api/tools');
                        this.tools = await r.json();
                        this.healthyCount = this.tools.filter(t => t.status === 'healthy').length;
                    } catch(e) { 
                        console.error('Failed to load tools:', e);
                        this.tools = []; 
                    }
                },
                async refreshHealth() {
                    try {
                        const r = await fetch('/api/tools/health/all');
                        const health = await r.json();
                        // Update tool status
                        health.forEach(h => {
                            const tool = this.tools.find(t => t.name === h.tool);
                            if (tool) tool.status = h.status;
                        });
                        this.healthyCount = this.tools.filter(t => t.status === 'healthy').length;
                    } catch(e) {}
                }
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
