<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIDP{% endblock %}</title>
    <script type="text/tailwindcss">
    @theme {
        --color-gray-50: #1f2937;
        --color-gray-100: #374151;
        --color-gray-200: #4b5563;
        --color-gray-300: #6b7280;
        --color-gray-400: #9ca3af;
        --color-gray-500: #9ca3af;
        --color-gray-600: #d1d5db;
        --color-gray-700: #d1d5db;
        --color-gray-800: #1f2937;
        --color-gray-900: #111827;
        --color-blue-100: #1e3a5f;
        --color-blue-700: #93c5fd;
        --color-green-100: #064e3b;
        --color-green-700: #6ee7b7;
        --color-red-100: #7f1d1d;
        --color-red-700: #fca5a5;
        --color-yellow-100: #78350f;
        --color-yellow-700: #fcd34d;
        --color-purple-100: #3b0764;
        --color-purple-700: #c4b5fd;
        --color-orange-100: #7c2d12;
        --color-orange-700: #fdba74;
        --color-indigo-600: #4f46e5;
    }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="aidp-base">
        [x-cloak]{display:none!important}
    </style>
    <!-- 统一样式守卫：MutationObserver 确保始终生效 -->
    <script>
    (function(){
        var css = [
            'body{background-color:#111827!important}',
            '.bg-white,.bg-gray-50{background-color:#1f2937!important}',
            '.text-gray-900,.text-gray-700,.text-gray-600,h1,h2,h3,h4{color:#f3f4f6!important}',
            '.text-gray-500,.text-gray-400,p{color:#9ca3af!important}',
            '.border-gray-200,.border-gray-300,td{border-color:#4b5563!important}',
            '.max-w-7xl{max-width:80rem!important;margin-left:auto!important;margin-right:auto!important}',
            'h1{font-size:1.5rem!important;font-weight:700!important}',
            'button{font-size:.875rem!important;border-radius:.5rem!important}',
            'th{padding:.75rem 1rem!important;font-size:.75rem!important}',
            'td{padding:1rem!important}',
            'input[placeholder*="搜索"]{font-size:.875rem!important;padding:.5rem .75rem!important}',
            '.line-clamp-2{overflow:hidden!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important}',
            'table{background-color:#374151!important}',
            'pre,code{background-color:#111827!important;color:#34d399!important}',
            '.shadow-sm,.shadow{box-shadow:0 1px 3px 0 rgba(0,0,0,.3)!important}',
            '.rounded-lg.border{background-color:#1f2937!important}',
            '.p-3,.p-4{padding:1rem!important}',
            '.grid-cols-4>div{padding:.75rem!important}',
            '.bg-green-100{background-color:#064e3b!important}.text-green-700{color:#6ee7b7!important}',
            '.bg-red-100{background-color:#7f1d1d!important}.text-red-700{color:#fca5a5!important}',
            '.bg-yellow-100{background-color:#78350f!important}.text-yellow-700{color:#fcd34d!important}',
            '.bg-blue-100{background-color:#1e3a5f!important}.text-blue-700{color:#93c5fd!important}',
            '.bg-purple-100{background-color:#3b0764!important}.text-purple-700{color:#c4b5fd!important}'
        ].join('');

        function inject() {
            var el = document.getElementById('aidp-unified');
            if (!el) { el = document.createElement('style'); el.id = 'aidp-unified'; document.head.appendChild(el); }
            el.textContent = css;
        }

        // 首次注入
        if (document.readyState === 'complete') inject();
        else window.addEventListener('load', inject);

        // 每隔 500ms 检查并重新注入，防止 Tailwind 后续覆盖
        setInterval(function(){
            var el = document.getElementById('aidp-unified');
            if (el) { el.parentNode.removeChild(el); document.head.appendChild(el); }
            else inject();
        }, 500);
    })();
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
