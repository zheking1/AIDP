<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - AIDP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-sm"><div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center"><span class="text-xl font-bold">AIDP Controller</span><a href="/" class="text-gray-600">Dashboard</a></div></nav>
    <div class="max-w-5xl mx-auto py-6 px-4">
        <h1 class="text-2xl font-semibold mb-4">Audit Logs</h1>
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Time</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">User</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Resource</th></tr></thead>
                <tbody id="logBody" class="bg-white divide-y divide-gray-200"><tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <script>
        fetch('/api/audit/')
            .then(r => r.json())
            .then(d => {
                document.getElementById('logBody').innerHTML = d.audits.map(a => `<tr><td class="px-6 py-4 text-sm">${a.created_at}</td><td class="px-6 py-4 text-sm">${a.user_id}</td><td class="px-6 py-4 text-sm">${a.action}</td><td class="px-6 py-4 text-sm">${a.resource}</td></tr>`).join('') || '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No logs</td></tr>';
            }).catch(() => document.getElementById('logBody').innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Failed to load</td></tr>');
    </script>
</body>
</html>
