<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDP - AI DevOps Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-indigo-400">AIDP</span>
                <span class="text-sm text-gray-500">AI DevOps Platform</span>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span class="text-gray-400">{{ username }}</span>
                <form action="/api/auth/logout" method="POST"><button class="text-gray-500 hover:text-gray-300">Logout</button></form>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto px-4 py-6" x-data="dashboard()" x-init="init()">
        <template x-if="tools.length > 0 && !redirectToOnboarding">
        {% block content %}{% endblock %}
        </template>
        <template x-if="redirectToOnboarding">
            <div class="text-center py-20">
                <h2 class="text-2xl font-bold text-white mb-4">Welcome to AIDP!</h2>
                <p class="text-gray-500 mb-6">Start by importing your project to unlock all features.</p>
                <a href="/onboarding" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded px-8 py-3 font-medium">Start Onboarding →</a>
            </div>
        </template>
    </div>
    <script>
        function dashboard() {
            return {
                tools: [],
                invocations: [],
                healthHistory: [],
                redirectToOnboarding: false,
                loading: true,
                async init() {
                    await Promise.all([this.loadTools(), this.loadInvocations(), this.loadHealth()]);
                    this.redirectToOnboarding = this.tools.length < 2;
                    this.loading = false;
                    setInterval(() => this.loadHealth(), 10000);
                },
                async loadTools() {
                    try {
                        const r = await fetch('/api/tools');
                        this.tools = await r.json();
                    } catch(e) { this.tools = []; }
                },
                async loadInvocations() {
                    try {
                        const r = await fetch('/api/tools/invocations/history?limit=20');
                        const d = await r.json();
                        this.invocations = d.invocations || d || [];
                    } catch(e) { this.invocations = []; }
                },
                async loadHealth() {
                    try {
                        const r = await fetch('/api/tools/health/all');
                        this.healthHistory = await r.json();
                    } catch(e) {}
                },
                statusColor(s) { return s === 'healthy' ? 'text-green-400' : s === 'registered' ? 'text-yellow-400' : 'text-red-400'; },
                statusBg(s) { return s === 'healthy' ? 'bg-green-900/50 border-green-700' : s === 'registered' ? 'bg-yellow-900/50 border-yellow-700' : 'bg-red-900/50 border-red-700'; },
            }
        }
    </script>
</body>
</html>
