{% extends "unified_base.html" %}
{% set active_page = 'tools' %}
{% block title %}工具列表{% endblock %}

{% block content %}
<div x-data="toolsPage()" x-init="init()" x-cloak>
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">工具管理</h1>
            <p class="text-gray-400 mt-1">查看和管理所有 AIDP 工具</p>
        </div>
        <div class="flex gap-3">
            <button @click="refreshAllHealth()" 
                    :disabled="refreshing"
                    class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition disabled:opacity-50">
                <i class="fas fa-sync-alt mr-2" :class="refreshing ? 'animate-spin' : ''"></i>
                刷新状态
            </button>
            <a href="/tools/manage" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">
                <i class="fas fa-plus mr-2"></i>注册工具
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 mb-6">
        <div class="flex flex-wrap gap-4">
            <div class="flex-1 min-w-64">
                <div class="relative">
                    <input type="text" 
                           x-model="searchQuery"
                           placeholder="搜索工具名称..."
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>
            <div class="flex gap-2">
                <select x-model="statusFilter" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    <option value="">所有状态</option>
                    <option value="healthy">健康</option>
                    <option value="registered">已注册</option>
                    <option value="unhealthy">不健康</option>
                    <option value="unreachable">不可达</option>
                    <option value="disabled">已禁用</option>
                </select>
                <select x-model="sortBy" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    <option value="name">按名称</option>
                    <option value="status">按状态</option>
                    <option value="updated">按更新时间</option>
                </select>
            </div>
        </div>
        
        <!-- Status Legend -->
        <div class="flex flex-wrap gap-4 mt-4 pt-4 border-t border-gray-700 text-xs">
            <span class="text-gray-500">状态图例:</span>
            <span class="flex items-center gap-1"><span class="status-dot status-healthy"></span> 健康</span>
            <span class="flex items-center gap-1"><span class="status-dot status-registered"></span> 已注册</span>
            <span class="flex items-center gap-1"><span class="status-dot status-unhealthy"></span> 不健康</span>
            <span class="flex items-center gap-1"><span class="status-dot status-unreachable"></span> 不可达</span>
            <span class="flex items-center gap-1"><span class="status-dot status-disabled"></span> 已禁用</span>
        </div>
    </div>

    <!-- Tools List -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-800/50 text-gray-400 border-b border-gray-700">
                    <tr>
                        <th class="px-5 py-4 text-left font-medium">工具</th>
                        <th class="px-5 py-4 text-left font-medium">状态</th>
                        <th class="px-5 py-4 text-left font-medium">端点</th>
                        <th class="px-5 py-4 text-left font-medium">能力</th>
                        <th class="px-5 py-4 text-left font-medium">版本</th>
                        <th class="px-5 py-4 text-left font-medium">健康检查</th>
                        <th class="px-5 py-4 text-left font-medium">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <template x-for="tool in filteredTools" :key="tool.name">
                        <tr class="hover:bg-gray-700/30 transition">
                            <td class="px-5 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg flex items-center justify-center"
                                         :class="tool.status === 'healthy' ? 'bg-green-500/20' : tool.status === 'registered' ? 'bg-yellow-500/20' : 'bg-red-500/20'">
                                        <i class="fas fa-cube" :class="tool.status === 'healthy' ? 'text-green-400' : tool.status === 'registered' ? 'text-yellow-400' : 'text-red-400'"></i>
                                    </div>
                                    <div>
                                        <div class="font-medium text-white" x-text="tool.displayName || tool.name"></div>
                                        <div class="text-xs text-gray-500" x-text="tool.name"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-5 py-4">
                                <span class="px-2 py-1 rounded-full text-xs font-medium"
                                      :class="{
                                          'bg-green-500/20 text-green-400': tool.status === 'healthy',
                                          'bg-yellow-500/20 text-yellow-400': tool.status === 'registered',
                                          'bg-red-500/20 text-red-400': tool.status === 'unreachable' || tool.status === 'unhealthy',
                                          'bg-gray-500/20 text-gray-400': tool.status === 'disabled'
                                      }"
                                      x-text="tool.status"></span>
                            </td>
                            <td class="px-5 py-4">
                                <code class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300" x-text="tool.endpoint"></code>
                            </td>
                            <td class="px-5 py-4">
                                <span class="text-gray-400">
                                    <span x-text="(tool.capabilities || []).length"></span> 个能力
                                </span>
                            </td>
                            <td class="px-5 py-4 text-gray-400" x-text="tool.version || '-'"></td>
                            <td class="px-5 py-4 text-gray-400 text-xs">
                                <span x-show="tool.lastHealthCheck" x-text="formatTime(tool.lastHealthCheck)"></span>
                                <span x-show="!tool.lastHealthCheck" class="text-gray-600">未检查</span>
                            </td>
                            <td class="px-5 py-4">
                                <div class="flex items-center gap-2">
                                    <a :href="'/tools/' + tool.name" 
                                       class="p-2 text-indigo-400 hover:bg-indigo-500/20 rounded-lg transition"
                                       title="打开工具">
                                        <i class="fas fa-external-link-alt"></i>
                                    </a>
                                    <button @click="checkHealth(tool.name)"
                                            :disabled="checking === tool.name"
                                            class="p-2 text-blue-400 hover:bg-blue-500/20 rounded-lg transition"
                                            title="健康检查">
                                        <i class="fas fa-heartbeat" :class="checking === tool.name ? 'animate-pulse' : ''"></i>
                                    </button>
                                    <button @click="syncCap(tool.name)"
                                            :disabled="syncing === tool.name"
                                            class="p-2 text-purple-400 hover:bg-purple-500/20 rounded-lg transition"
                                            title="同步能力">
                                        <i class="fas fa-sync" :class="syncing === tool.name ? 'animate-spin' : ''"></i>
                                    </button>
                                    <button @click="toggleTool(tool)"
                                            class="p-2 rounded-lg transition"
                                            :class="tool.status === 'disabled' ? 'text-green-400 hover:bg-green-500/20' : 'text-yellow-400 hover:bg-yellow-500/20'"
                                            :title="tool.status === 'disabled' ? '启用' : '禁用'">
                                        <i class="fas" :class="tool.status === 'disabled' ? 'fa-play' : 'fa-pause'"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredTools.length === 0">
                        <td colspan="7" class="px-5 py-12 text-center text-gray-500">
                            <i class="fas fa-search text-3xl mb-3 block"></i>
                            <p>未找到匹配的工具</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tool Detail Modal -->
    <div x-show="selectedTool" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 rounded-xl border border-gray-700 max-w-2xl w-full max-h-[80vh] overflow-y-auto"
             @click.away="selectedTool = null">
            <div class="p-5 border-b border-gray-700 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-white" x-text="selectedTool?.displayName || selectedTool?.name"></h3>
                <button @click="selectedTool = null" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">名称</label>
                        <div class="text-sm text-white" x-text="selectedTool?.name"></div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">状态</label>
                        <span class="px-2 py-1 rounded text-xs" 
                              :class="'bg-' + (selectedTool?.status === 'healthy' ? 'green' : selectedTool?.status === 'registered' ? 'yellow' : 'red') + '-500/20 text-' + (selectedTool?.status === 'healthy' ? 'green' : selectedTool?.status === 'registered' ? 'yellow' : 'red') + '-400'"
                              x-text="selectedTool?.status"></span>
                    </div>
                    <div class="col-span-2">
                        <label class="text-xs text-gray-500 block mb-1">端点</label>
                        <code class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300" x-text="selectedTool?.endpoint"></code>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">版本</label>
                        <div class="text-sm text-white" x-text="selectedTool?.version || '-'"></div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block mb-1">描述</label>
                        <div class="text-sm text-white" x-text="selectedTool?.description || '-'"></div>
                    </div>
                </div>
                
                <div>
                    <label class="text-xs text-gray-500 block mb-2">能力列表</label>
                    <div class="space-y-2">
                        <template x-for="cap in selectedTool?.capabilities || []" :key="cap.name">
                            <div class="bg-gray-700/50 rounded-lg p-3">
                                <div class="font-medium text-white text-sm" x-text="cap.name"></div>
                                <div class="text-xs text-gray-400 mt-1" x-text="cap.description || '无描述'"></div>
                            </div>
                        </template>
                        <div x-show="!(selectedTool?.capabilities || []).length" class="text-gray-500 text-sm">
                            暂无能力信息
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-5 border-t border-gray-700 flex justify-end gap-3">
                <button @click="selectedTool = null" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm">
                    关闭
                </button>
                <a :href="'/tools/' + selectedTool?.name" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm">
                    打开工具
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function toolsPage() {
    return {
        tools: [],
        searchQuery: '',
        statusFilter: '',
        sortBy: 'name',
        refreshing: false,
        checking: null,
        syncing: null,
        selectedTool: null,
        
        get filteredTools() {
            let result = [...this.tools];
            
            // Filter by search
            if (this.searchQuery) {
                const q = this.searchQuery.toLowerCase();
                result = result.filter(t => 
                    (t.name && t.name.toLowerCase().includes(q)) ||
                    (t.displayName && t.displayName.toLowerCase().includes(q))
                );
            }
            
            // Filter by status
            if (this.statusFilter) {
                result = result.filter(t => t.status === this.statusFilter);
            }
            
            // Sort
            result.sort((a, b) => {
                if (this.sortBy === 'name') return (a.displayName || a.name).localeCompare(b.displayName || b.name);
                if (this.sortBy === 'status') return a.status.localeCompare(b.status);
                if (this.sortBy === 'updated') return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
                return 0;
            });
            
            return result;
        },
        
        async init() {
            await this.loadTools();
        },
        
        async loadTools() {
            try {
                const r = await fetch('/api/tools');
                this.tools = await r.json();
            } catch(e) { 
                console.error('Failed to load tools:', e);
                this.tools = []; 
            }
        },
        
        async refreshAllHealth() {
            this.refreshing = true;
            try {
                await fetch('/api/tools/health/all');
                await this.loadTools();
            } finally {
                this.refreshing = false;
            }
        },
        
        async checkHealth(name) {
            this.checking = name;
            try {
                await fetch(`/api/tools/${name}/health`, { method: 'POST' });
                await this.loadTools();
            } finally {
                this.checking = null;
            }
        },
        
        async syncCap(name) {
            this.syncing = name;
            try {
                await fetch(`/api/tools/${name}/sync`, { method: 'POST' });
                await this.loadTools();
            } finally {
                this.syncing = null;
            }
        },
        
        async toggleTool(tool) {
            const action = tool.status === 'disabled' ? 'enable' : 'disable';
            try {
                await fetch(`/api/tools/${tool.name}/${action}`, { method: 'POST' });
                await this.loadTools();
            } catch(e) {
                alert('操作失败: ' + e.message);
            }
        },
        
        formatTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        },
        
        showDetail(tool) {
            this.selectedTool = tool;
        }
    }
}
</script>
{% endblock %}
