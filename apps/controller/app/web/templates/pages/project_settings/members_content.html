<div x-data="settingsMembers()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">成员管理</h1>
            <p class="text-sm text-gray-400 mt-0.5">管理项目成员和角色权限</p>
        </div>
    </div>

    <div class="mt-6 bg-gray-800 rounded-xl border border-gray-700/50 p-6 space-y-5">
        <div class="flex gap-3">
            <input type="text" x-model="inviteEmail" placeholder="输入邮箱邀请成员..."
                   class="flex-1 px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
            <select x-model="inviteRole"
                    class="px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
                <option value="viewer">查看者</option>
                <option value="editor">编辑者</option>
                <option value="admin">管理员</option>
            </select>
            <button @click="invite()"
                    class="inline-flex items-center gap-1.5 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition-all duration-150 shadow-sm hover:shadow-indigo-500/25 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                邀请
            </button>
        </div>

        <div class="overflow-hidden rounded-xl border border-gray-700/50">
            <table class="min-w-full">
                <thead>
                    <tr class="bg-gray-900/40 border-b border-gray-700/50">
                        <th class="text-left py-3 px-4 text-xs font-medium text-gray-500 uppercase tracking-wider">用户</th>
                        <th class="text-left py-3 px-4 text-xs font-medium text-gray-500 uppercase tracking-wider">角色</th>
                        <th class="text-right py-3 px-4 text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700/30">
                    <template x-for="m in members" :key="m.id">
                        <tr class="hover:bg-gray-700/20 transition-colors">
                            <td class="py-3 px-4 text-sm text-gray-300" x-text="m.user_id || m.username"></td>
                            <td class="py-3 px-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 text-xs font-medium rounded-full bg-gray-700/60 text-gray-300" x-text="m.role"></span>
                            </td>
                            <td class="py-3 px-4 text-right">
                                <button @click="removeMember(m)" class="text-red-400 hover:text-red-300 transition-colors" title="移除成员">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div x-show="members.length === 0" class="text-center py-8 text-sm text-gray-500">暂无成员</div>
        </div>

        <p x-show="saved" class="text-green-400 text-sm flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已更新</p>
    </div>
</div>
<script>
function settingsMembers() {
  return { members: [], inviteEmail: '', inviteRole: 'viewer', saved: false,
    async init() { try { const r = await fetch('/api/projects/{{project_id}}/members'); if(r.ok) this.members = (await r.json()).items || []; } catch(e){} },
    async invite() {
      if(!this.inviteEmail) return;
      try { const r = await fetch('/api/projects/{{project_id}}/members', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:this.inviteEmail, role:this.inviteRole}) }); if(r.ok) { this.inviteEmail=''; this.init(); this.saved=true; setTimeout(()=>this.saved=false,3000); } } catch(e){}
    },
    async removeMember(m) { try { await fetch('/api/projects/{{project_id}}/members/'+m.id, {method:'DELETE'}); this.init(); } catch(e){} }
  };
}
</script>
