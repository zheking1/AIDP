{% extends "pages/project_settings/base.html" %}
{% block settings_content %}
<h2 class="text-lg font-semibold text-gray-900 mb-4">AI 配置</h2>
<div class="max-w-7xl mx-auto px-4"><div class="space-y-4" x-data="settingsInstructions()" x-init="init()">
  <div><label class="block text-sm font-medium text-gray-700 mb-1">Agent Instructions</label><textarea x-model="form.instructions" rows="10" class="w-full border rounded-lg px-3 py-2 font-mono text-sm"></textarea><p class="text-xs text-gray-400 mt-1">定义 AI Agent 的行为指令和约束</p></div>
  <button @click="save()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition">保存</button>
  <p x-show="saved" class="text-green-600 text-sm"><i class="fas fa-check mr-1"></i>已保存</p>
</div>
<script>
function settingsInstructions() {
  return { form: { instructions: '' }, saved: false,
    async init() { try { const r = await fetch('/api/projects/{{project_id}}/instructions'); if(r.ok) this.form.instructions = (await r.json()).content || ''; } catch(e){} },
    async save() { try { const r = await fetch('/api/projects/{{project_id}}/instructions', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.form) }); if(r.ok) { this.saved = true; setTimeout(()=>this.saved=false,3000); } } catch(e){} }
  };
}
</script>
{% endblock %}
