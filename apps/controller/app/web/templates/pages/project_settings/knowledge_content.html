<div x-data="settingsKnowledge()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">知识库配置</h1>
            <p class="text-sm text-gray-400 mt-0.5">分块策略、向量模型等知识库参数</p>
        </div>
    </div>

    <div class="mt-6 bg-gray-800 rounded-xl border border-gray-700/50 p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">分块策略</label>
            <select x-model="form.chunking_strategy"
                    class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
                <option value="fixed">固定大小</option>
                <option value="semantic">语义分块</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">分块大小</label>
            <input type="number" x-model.number="form.chunk_size"
                   class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
            <p class="text-xs text-gray-500 mt-1">字符数，默认 500</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">重叠量</label>
            <input type="number" x-model.number="form.chunk_overlap"
                   class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">向量模型</label>
            <input type="text" x-model="form.embedding_model"
                   class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
        </div>
        <div class="flex items-center gap-3">
            <button @click="save()"
                    class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition-all duration-150 shadow-sm hover:shadow-indigo-500/25">保存</button>
            <p x-show="saved" class="text-green-400 text-sm flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已保存</p>
        </div>
    </div>
</div>
<script>
function settingsKnowledge() {
  return { form: { chunking_strategy: 'fixed', chunk_size: 500, chunk_overlap: 50, embedding_model: 'text-embedding-3-small' }, saved: false,
    async init() { try { const r = await fetch('/api/projects/{{project_id}}/knowledge-bases?limit=1'); if(r.ok) { const bases = (await r.json()).items || []; if(bases.length>0) { const b = bases[0]; this.form = { chunking_strategy: b.chunking_strategy, chunk_size: b.chunk_size, chunk_overlap: b.chunk_overlap, embedding_model: b.embedding_model }; } } } catch(e){} },
    async save() { try { const r = await fetch('/api/projects/{{project_id}}/settings/knowledge', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.form) }); if(r.ok) { this.saved = true; setTimeout(()=>this.saved=false,3000); } } catch(e){} }
  };
}
</script>
