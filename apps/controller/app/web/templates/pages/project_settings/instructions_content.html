<div x-data="settingsInstructions()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">AI 配置</h1>
            <p class="text-sm text-gray-400 mt-0.5">定义 AI Agent 的行为指令和约束</p>
        </div>
    </div>

    <div class="mt-6 bg-gray-800 rounded-xl border border-gray-700/50 p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">Agent Instructions</label>
            <textarea x-model="form.instructions" rows="10"
                      class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white font-mono placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all resize-none"></textarea>
            <p class="text-xs text-gray-500 mt-1.5">定义 AI Agent 的行为指令和约束</p>
        </div>
        <div class="flex items-center gap-3">
            <button @click="save()"
                    class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition-all duration-150 shadow-sm hover:shadow-indigo-500/25">保存</button>
            <p x-show="saved" class="text-green-400 text-sm flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已保存</p>
        </div>
    </div>
</div>
<script>
function settingsInstructions() {
  return { form: { instructions: '' }, saved: false,
    async init() { try { const r = await fetch('/api/projects/{{project_id}}/instructions'); if(r.ok) this.form.instructions = (await r.json()).content || ''; } catch(e){} },
    async save() { try { const r = await fetch('/api/projects/{{project_id}}/instructions', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.form) }); if(r.ok) { this.saved = true; setTimeout(()=>this.saved=false,3000); } } catch(e){} }
  };
}
</script>
