<div x-data="settingsGeneral()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">项目设置</h1>
            <p class="text-sm text-gray-400 mt-0.5">项目名称、描述和可见性配置</p>
        </div>
    </div>

    <div class="mt-6 bg-gray-800 rounded-xl border border-gray-700/50 p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">项目名称</label>
            <input type="text" x-model="form.name"
                   class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">描述</label>
            <textarea x-model="form.description" rows="3"
                      class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all resize-none"></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">可见性</label>
            <div class="grid grid-cols-3 gap-3">
                <label @click="form.visibility='private'"
                       class="flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all"
                       :class="form.visibility === 'private' ? 'bg-indigo-500/10 border-indigo-500/40 text-indigo-300' : 'bg-gray-900/40 border-gray-700/60 text-gray-400 hover:border-gray-500'">
                    <i class="fas fa-lock"></i>
                    <div>
                        <div class="text-sm font-medium">私有</div>
                        <div class="text-xs opacity-60">仅项目成员可见</div>
                    </div>
                </label>
                <label @click="form.visibility='internal'"
                       class="flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all"
                       :class="form.visibility === 'internal' ? 'bg-indigo-500/10 border-indigo-500/40 text-indigo-300' : 'bg-gray-900/40 border-gray-700/60 text-gray-400 hover:border-gray-500'">
                    <i class="fas fa-users"></i>
                    <div>
                        <div class="text-sm font-medium">团队</div>
                        <div class="text-xs opacity-60">所有登录用户可见</div>
                    </div>
                </label>
                <label @click="form.visibility='public'"
                       class="flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer transition-all"
                       :class="form.visibility === 'public' ? 'bg-indigo-500/10 border-indigo-500/40 text-indigo-300' : 'bg-gray-900/40 border-gray-700/60 text-gray-400 hover:border-gray-500'">
                    <i class="fas fa-globe"></i>
                    <div>
                        <div class="text-sm font-medium">公开</div>
                        <div class="text-xs opacity-60">所有人可见</div>
                    </div>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">技术栈</label>
            <input type="text" x-model="techStackStr" @input="updateTechStack"
                   placeholder="Vue 3, FastAPI, PostgreSQL ..."
                   class="w-full px-3.5 py-2.5 bg-gray-900/60 border border-gray-700/60 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
            <p class="text-xs text-gray-500 mt-1">用逗号分隔多个技术</p>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button @click="save()"
                    class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition-all duration-150 shadow-sm hover:shadow-indigo-500/25">保存</button>
            <p x-show="saved" class="text-green-400 text-sm flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已保存
            </p>
        </div>
    </div>
</div>
<script>
function settingsGeneral() {
  return {
    form: { name: '', description: '', visibility: 'private', tech_stack: '' },
    techStackStr: '',
    saved: false,
    async init() {
      try {
        const r = await fetch('/api/projects/{{project_id}}');
        if (r.ok) {
          const d = await r.json();
          this.form.name = d.name;
          this.form.description = d.description || '';
          this.form.visibility = d.visibility || 'private';
          this.form.tech_stack = d.tech_stack || '';
          this.techStackStr = Array.isArray(d.tech_stack) ? d.tech_stack.join(', ') : (d.tech_stack || '');
        }
      } catch(e) {}
    },
    updateTechStack() {
      if (this.techStackStr.trim()) {
        this.form.tech_stack = JSON.stringify(this.techStackStr.split(',').map(s => s.trim()).filter(Boolean));
      } else {
        this.form.tech_stack = '';
      }
    },
    async save() {
      this.updateTechStack();
      try {
        const r = await fetch('/api/projects/{{project_id}}', {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            name: this.form.name,
            description: this.form.description,
            visibility: this.form.visibility,
            tech_stack: this.form.tech_stack,
          })
        });
        if (r.ok) {
          this.saved = true;
          setTimeout(() => this.saved = false, 3000);
        }
      } catch(e) {}
    }
  };
}
</script>
