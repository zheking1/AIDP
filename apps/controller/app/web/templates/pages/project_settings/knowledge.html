{% extends "pages/project_settings/base.html" %}
{% block settings_content %}
<h2 class="text-lg font-semibold text-gray-900 mb-4">知识库配置</h2>
<div class="max-w-7xl mx-auto px-4"><div class="space-y-4" x-data="settingsKnowledge()" x-init="init()">
  <div><label class="block text-sm font-medium text-gray-700 mb-1">分块策略</label><select x-model="form.chunking_strategy" class="w-full border rounded-lg px-3 py-2"><option value="fixed">固定大小</option><option value="semantic">语义分块</option></select></div>
  <div><label class="block text-sm font-medium text-gray-700 mb-1">分块大小</label><input type="number" x-model.number="form.chunk_size" class="w-full border rounded-lg px-3 py-2"><p class="text-xs text-gray-400">字符数，默认 500</p></div>
  <div><label class="block text-sm font-medium text-gray-700 mb-1">重叠量</label><input type="number" x-model.number="form.chunk_overlap" class="w-full border rounded-lg px-3 py-2"></div>
  <div><label class="block text-sm font-medium text-gray-700 mb-1">向量模型</label><input type="text" x-model="form.embedding_model" class="w-full border rounded-lg px-3 py-2"></div>
  <button @click="save()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition">保存</button>
  <p x-show="saved" class="text-green-600 text-sm"><i class="fas fa-check mr-1"></i>已保存</p>
</div>
<script>
function settingsKnowledge() {
  return { form: { chunking_strategy: 'fixed', chunk_size: 500, chunk_overlap: 50, embedding_model: 'text-embedding-3-small' }, saved: false,
    async init() { try { const r = await fetch('/api/projects/{{project_id}}/knowledge-bases?limit=1'); if(r.ok) { const bases = (await r.json()).items || []; if(bases.length>0) { const b = bases[0]; this.form = { chunking_strategy: b.chunking_strategy, chunk_size: b.chunk_size, chunk_overlap: b.chunk_overlap, embedding_model: b.embedding_model }; } } } catch(e){} },
    async save() { try { const r = await fetch('/api/projects/{{project_id}}/settings/knowledge', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.form) }); if(r.ok) { this.saved = true; setTimeout(()=>this.saved=false,3000); } } catch(e){} }
  };
}
</script>
{% endblock %}
