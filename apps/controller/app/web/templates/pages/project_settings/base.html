{% extends "layouts/unified_base.html" %}
{% block title %}项目设置 - AIDP{% endblock %}
{% block content %}
<div class="min-h-screen">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">项目设置</h1>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="lg:col-span-1 space-y-1">
        <a href="/project/{{project_id}}/settings/general" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 transition {{ 'bg-indigo-50 text-indigo-700 font-medium' if active_tab == 'general' else 'text-gray-600' }}"><i class="fas fa-info w-5"></i>基本信息</a>
        <a href="/project/{{project_id}}/settings/instructions" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 transition {{ 'bg-indigo-50 text-indigo-700 font-medium' if active_tab == 'instructions' else 'text-gray-600' }}"><i class="fas fa-cpu w-5"></i>AI配置</a>
        <a href="/project/{{project_id}}/settings/knowledge/general" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 transition {{ 'bg-indigo-50 text-indigo-700 font-medium' if active_tab == 'knowledge' else 'text-gray-600' }}"><i class="fas fa-book w-5"></i>知识库配置</a>
        <a href="/project/{{project_id}}/settings/members" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 transition {{ 'bg-indigo-50 text-indigo-700 font-medium' if active_tab == 'members' else 'text-gray-600' }}"><i class="fas fa-users w-5"></i>成员管理</a>
        <a href="/project/{{project_id}}/settings/integrations/git" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-100 transition {{ 'bg-indigo-50 text-indigo-700 font-medium' if active_tab == 'integrations' else 'text-gray-600' }}"><i class="fas fa-plug w-5"></i>集成</a>
      </div>
      <div class="lg:col-span-3 bg-white rounded-lg border p-6">
        {% block settings_content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
