{% extends "pages/project_settings/base.html" %}
{% block settings_content %}
<h2 class="text-lg font-semibold text-gray-900 mb-4">基本信息</h2>
<div class="max-w-7xl mx-auto px-4"><div class="space-y-4" x-data="settingsGeneral()" x-init="init()">
  <div><label class="block text-sm font-medium text-gray-700 mb-1">项目名称</label><input type="text" x-model="form.name" class="w-full border rounded-lg px-3 py-2"></div>
  <div><label class="block text-sm font-medium text-gray-700 mb-1">描述</label><textarea x-model="form.description" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea></div>
  <button @click="save()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition">保存</button>
  <p x-show="saved" class="text-green-600 text-sm"><i class="fas fa-check mr-1"></i>已保存</p>
</div>
<script>
function settingsGeneral() {
  return { form: { name: '', description: '' }, saved: false,
    async init() {
      try { const r = await fetch('/api/projects/{{project_id}}'); if(r.ok) { const d = await r.json(); this.form.name = d.name; this.form.description = d.description || ''; } } catch(e){}
    },
    async save() {
      try { const r = await fetch('/api/projects/{{project_id}}', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.form) }); if(r.ok) { this.saved = true; setTimeout(()=>this.saved=false,3000); } } catch(e){}
    }
  };
}
</script>
{% endblock %}
