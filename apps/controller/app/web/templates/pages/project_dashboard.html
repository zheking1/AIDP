{% if embed %}{% extends "layouts/embed.html" %}{% else %}{% extends "layouts/unified_base.html" %}{% endif %}
{% block title %}项目仪表盘 - AIDP{% endblock %}
{% block content %}
<div class="min-h-screen" x-data="projectDashboard()" x-init="init()">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">项目仪表盘</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg border p-4"><div class="text-sm text-gray-500">知识文档</div><div class="text-2xl font-bold text-blue-600" x-text="stats.knowledge_docs || 0"></div></div>
      <div class="bg-white rounded-lg border p-4"><div class="text-sm text-gray-500">项目记忆</div><div class="text-2xl font-bold text-purple-600" x-text="stats.memories || 0"></div></div>
      <div class="bg-white rounded-lg border p-4"><div class="text-sm text-gray-500">代码资产</div><div class="text-2xl font-bold text-green-600" x-text="stats.assets || 0"></div></div>
      <div class="bg-white rounded-lg border p-4"><div class="text-sm text-gray-500">项目技能</div><div class="text-2xl font-bold text-yellow-600" x-text="stats.skills || 0"></div></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-lg border p-4"><h2 class="font-semibold mb-3">快速操作</h2><div class="space-y-2"><a href="/knowledge/documents" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition"><i class="fas fa-file-text text-blue-500 w-6"></i><span>管理文档</span></a><a href="/memory/memories" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition"><i class="fas fa-brain text-purple-500 w-6"></i><span>浏览记忆</span></a><a href="/sandbox" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition"><i class="fas fa-terminal text-green-500 w-6"></i><span>打开沙箱</span></a><a href="/quality" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition"><i class="fas fa-check-circle text-indigo-500 w-6"></i><span>质量检查</span></a></div></div>
      <div class="bg-white rounded-lg border p-4"><h2 class="font-semibold mb-3">最近活动</h2><div class="space-y-2" x-show="activities.length>0"><template x-for="a in activities" :key="a.id"><div class="flex items-center gap-3 text-sm p-2 rounded-lg"><span class="w-2 h-2 rounded-full bg-blue-400"></span><span class="text-gray-600" x-text="a.action"></span><span class="text-gray-400 ml-auto text-xs" x-text="a.created_at?.substring(0,16)"></span></div></template></div><p x-show="activities.length===0" class="text-gray-400 text-sm">暂无活动</p></div>
    </div>
  </div>
</div>
<script>
function projectDashboard() {
  return { stats: {}, activities: [],
    async init() {
      try {
        const [k, m, a, s] = await Promise.all([
          fetch('/api/knowledge/stats').then(r=>r.ok?r.json():{}),
          fetch('/api/memory/stats').then(r=>r.ok?r.json():{}),
          fetch('/api/assets/stats').then(r=>r.ok?r.json():{}),
          fetch('/api/skills/stats').then(r=>r.ok?r.json():{})
        ]);
        this.stats = { knowledge_docs: k.total_documents || 0, memories: m.total || 0, assets: a.total || 0, skills: s.total || 0 };
      } catch(e){}
      try { const r = await fetch('/api/audit/logs?limit=5'); if(r.ok) this.activities = (await r.json()).items || []; } catch(e){}
    }
  };
}
</script>
{% endblock %}
