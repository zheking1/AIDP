<div x-data="projectDashboard()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">项目仪表盘</h1>
            <p class="text-gray-400 text-sm mt-1">项目概览和快速操作</p>
        </div>
    </div>

    <div class="">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="text-xs text-gray-500 uppercase tracking-wider">知识文档</div>
            <div class="text-2xl font-bold text-blue-400 mt-1" x-text="stats.knowledge_docs || 0"></div>
        </div>
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <div class="text-xs text-gray-500 uppercase tracking-wider">项目记忆</div>
            <div class="text-2xl font-bold text-purple-400 mt-1" x-text="stats.memories || 0"></div>
        </div>
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <div class="text-xs text-gray-500 uppercase tracking-wider">代码资产</div>
            <div class="text-2xl font-bold text-green-400 mt-1" x-text="stats.assets || 0"></div>
        </div>
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <div class="text-xs text-gray-500 uppercase tracking-wider">项目技能</div>
            <div class="text-2xl font-bold text-yellow-400 mt-1" x-text="stats.skills || 0"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <h2 class="font-semibold text-white mb-3">快速操作</h2>
            <div class="space-y-2">
                <a href="/knowledge/documents" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-700/50 transition text-gray-300 hover:text-white">
                    <i class="fas fa-file-text text-blue-400 w-6"></i><span>管理文档</span>
                </a>
                <a href="/memory/memories" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-700/50 transition text-gray-300 hover:text-white">
                    <i class="fas fa-brain text-purple-400 w-6"></i><span>浏览记忆</span>
                </a>
                <a href="/sandbox" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-700/50 transition text-gray-300 hover:text-white">
                    <i class="fas fa-terminal text-green-400 w-6"></i><span>打开沙箱</span>
                </a>
                <a href="/quality" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-700/50 transition text-gray-300 hover:text-white">
                    <i class="fas fa-check-circle text-indigo-400 w-6"></i><span>质量检查</span>
                </a>
            </div>
        </div>
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4">
            <h2 class="font-semibold text-white mb-3">最近活动</h2>
            <div class="space-y-2" x-show="activities.length>0">
                <template x-for="a in activities" :key="a.id">
                    <div class="flex items-center gap-3 text-sm p-2 rounded-lg">
                        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                        <span class="text-gray-400" x-text="a.action"></span>
                        <span class="text-gray-600 ml-auto text-xs" x-text="a.created_at?.substring(0,16)"></span>
                    </div>
                </template>
            </div>
            <p x-show="activities.length===0" class="text-gray-500 text-sm">暂无活动</p>
        </div>
    </div>
</div>
<script>
function projectDashboard() {
    return { stats: {}, activities: [],
        async init() {
            try {
                const [k, m, a, s] = await Promise.all([
                    fetch('/api/knowledge/stats').then(r=>r.ok?r.json():{}),
                    fetch('/api/memory/stats').then(r=>r.ok?r.json():{}),
                    fetch('/api/assets/stats').then(r=>r.ok?r.json():{}),
                    fetch('/api/skills/stats').then(r=>r.ok?r.json():{})
                ]);
                this.stats = { knowledge_docs: k.total_documents || 0, memories: m.total || 0, assets: a.total || 0, skills: s.total || 0 };
            } catch(e) {}
        }
    };
}
</script>
