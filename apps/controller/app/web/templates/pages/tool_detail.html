{% extends "layouts/base.html" %}
{% set active_page = 'tools' %}
{% block title %}{{ tool_name }} - 工具详情{% endblock %}

{% block content %}
<div x-data="AIDP.toolDetailData('{{ tool_name }}')" x-init="init()" class="animate-fade-in">
    <!-- Loading State -->
    <div x-show="loading" class="flex items-center justify-center h-64">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-400 mb-3"></i>
            <p class="text-gray-400">加载工具信息...</p>
        </div>
    </div>

    <!-- Error State -->
    <div x-show="error && !loading" class="bg-red-500/10 border border-red-500/20 rounded-xl p-6 text-center">
        <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-3"></i>
        <h3 class="text-lg font-semibold text-white mb-2">加载失败</h3>
        <p class="text-gray-400" x-text="error"></p>
        <button @click="loadTool()" class="mt-4 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">
            <i class="fas fa-redo mr-2"></i>重试
        </button>
    </div>

    <!-- Tool Content -->
    <div x-show="tool && !loading" x-cloak>
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl flex items-center justify-center"
                     :class="'bg-' + getStatusColor(tool.status) + '-500/20'">
                    <i class="fas fa-cube text-2xl" :class="'text-' + getStatusColor(tool.status) + '-400'"></i>
                </div>
                <div>
                    <div class="flex items-center gap-3">
                        <h1 class="text-2xl font-bold text-white" x-text="tool.displayName || tool.name"></h1>
                        <span class="px-2 py-1 rounded-full text-xs font-medium"
                              :class="'bg-' + getStatusColor(tool.status) + '-500/20 text-' + getStatusColor(tool.status) + '-400'"
                              x-text="tool.status"></span>
                    </div>
                    <p class="text-gray-400 text-sm mt-1" x-text="tool.description || '无描述'"></p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <a :href="tool.endpoint" target="_blank" 
                   class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fas fa-external-link-alt"></i> 直接访问
                </a>
                <button @click="checkHealth()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fas fa-heartbeat"></i> 健康检查
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="border-b border-gray-700 mb-6">
            <nav class="flex gap-6">
                <button @click="activeTab = 'overview'" 
                        :class="activeTab === 'overview' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-gray-400 hover:text-gray-300'"
                        class="pb-3 border-b-2 font-medium text-sm transition">
                    <i class="fas fa-info-circle mr-2"></i>概览
                </button>
                <button @click="activeTab = 'capabilities'" 
                        :class="activeTab === 'capabilities' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-gray-400 hover:text-gray-300'"
                        class="pb-3 border-b-2 font-medium text-sm transition">
                    <i class="fas fa-plug mr-2"></i>能力 (<span x-text="capabilities.length"></span>)
                </button>
                <button @click="switchToWebUI()" 
                        :class="activeTab === 'webui' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-gray-400 hover:text-gray-300'"
                        class="pb-3 border-b-2 font-medium text-sm transition">
                    <i class="fas fa-desktop mr-2"></i>Web 界面
                </button>
                <button @click="activeTab = 'logs'" 
                        :class="activeTab === 'logs' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-gray-400 hover:text-gray-300'"
                        class="pb-3 border-b-2 font-medium text-sm transition">
                    <i class="fas fa-terminal mr-2"></i>日志
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div class="min-h-[400px]">
            <!-- Overview Tab -->
            <div x-show="activeTab === 'overview'" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                        <div class="text-sm text-gray-400 mb-1">工具名称</div>
                        <div class="text-white font-medium" x-text="tool.name"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                        <div class="text-sm text-gray-400 mb-1">显示名称</div>
                        <div class="text-white font-medium" x-text="tool.displayName || '-'"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                        <div class="text-sm text-gray-400 mb-1">版本</div>
                        <div class="text-white font-medium" x-text="tool.version || '-'"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 md:col-span-2">
                        <div class="text-sm text-gray-400 mb-1">端点地址</div>
                        <div class="flex items-center gap-2">
                            <code class="text-sm bg-gray-700 px-3 py-1.5 rounded text-indigo-300 flex-1" x-text="tool.endpoint"></code>
                            <button @click="navigator.clipboard.writeText(tool.endpoint)" class="p-2 text-gray-400 hover:text-white transition" title="复制">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                        <div class="text-sm text-gray-400 mb-1">最后健康检查</div>
                        <div class="text-white font-medium" x-text="tool.lastHealthCheck ? new Date(tool.lastHealthCheck).toLocaleString('zh-CN') : '从未'"></div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <h3 class="text-sm font-semibold text-white mb-3">快捷操作</h3>
                    <div class="flex flex-wrap gap-3">
                        <button @click="syncCapabilities()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm transition flex items-center gap-2">
                            <i class="fas fa-sync"></i> 同步能力
                        </button>
                        <button @click="AIDP.toolService.enableTool(tool.name)" 
                                x-show="tool.status === 'disabled'"
                                class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm transition flex items-center gap-2">
                            <i class="fas fa-play"></i> 启用工具
                        </button>
                        <button @click="AIDP.toolService.disableTool(tool.name)" 
                                x-show="tool.status !== 'disabled'"
                                class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg text-sm transition flex items-center gap-2">
                            <i class="fas fa-pause"></i> 禁用工具
                        </button>
                    </div>
                </div>
            </div>

            <!-- Capabilities Tab -->
            <div x-show="activeTab === 'capabilities'" class="space-y-4">
                <div x-show="capabilities.length === 0" class="text-center py-12 text-gray-500">
                    <i class="fas fa-plug text-4xl mb-3"></i>
                    <p>暂无能力信息</p>
                    <button @click="syncCapabilities()" class="mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm">
                        同步能力
                    </button>
                </div>

                <template x-for="cap in capabilities" :key="cap.name">
                    <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-semibold text-white" x-text="cap.name"></h3>
                                <p class="text-sm text-gray-400 mt-1" x-text="cap.description || '无描述'"></p>
                            </div>
                            <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-400" x-text="cap.method || 'POST'"></span>
                        </div>
                        <div class="mt-3 flex items-center gap-4 text-sm">
                            <span class="text-gray-500">
                                <i class="fas fa-clock mr-1"></i> 超时: <span x-text="(cap.timeoutMs || 0) + 'ms'"></span>
                            </span>
                            <span class="text-gray-500">
                                <i class="fas fa-shield-alt mr-1"></i> 权限: <span x-text="cap.permission || '无'"></span>
                            </span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Web UI Tab -->
            <div x-show="activeTab === 'webui'" class="h-[600px]">
              <div x-show="webuiLoading" class="flex items-center justify-center h-full">
                <i class="fas fa-spinner fa-spin text-2xl text-indigo-400"></i>
              </div>
              <div id="tool-webui-content" class="w-full h-full rounded-xl border border-gray-700 overflow-y-auto" x-show="!webuiLoading"></div>
            </div>

            <!-- Logs Tab -->
            <div x-show="activeTab === 'logs'">
                <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                    <div class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
                        <h3 class="font-semibold text-white">最近调用日志</h3>
                        <a :href="'/logs?tool=' + tool.name" class="text-xs text-indigo-400 hover:text-indigo-300">查看全部</a>
                    </div>
                    <div class="p-4 text-center text-gray-500 py-12">
                        <i class="fas fa-terminal text-3xl mb-3"></i>
                        <p>日志功能开发中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
