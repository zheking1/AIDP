<div x-data="adminNasPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">NAS 文件管理</h1>
            <p class="text-gray-400 text-sm mt-1">浏览和管理项目代码文件</p>
        </div>
        <div class="flex items-center gap-2">
            <select x-model="selectedProjectId" @change="loadProjectFiles()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 min-w-[200px]">
                <option value="">选择项目...</option>
                <template x-for="p in projects" :key="p.id">
                    <option :value="p.id" x-text="p.name"></option>
                </template>
            </select>
        </div>
    </div>

    <div x-show="!selectedProjectId" class="text-center py-16 text-gray-500">
        <i class="fas fa-folder-open text-5xl text-gray-700 mb-4"></i>
        <p>请先选择一个项目</p>
    </div>

    <template x-if="selectedProjectId">
        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-700 flex items-center justify-between">
                <div class="flex items-center gap-2 text-sm">
                    <button @click="currentPath = ''; loadProjectFiles()" class="text-indigo-400 hover:text-indigo-300">根目录</button>
                    <template x-for="(seg, i) in currentPath.split('/').filter(Boolean)" :key="i">
                        <span class="flex items-center gap-1">
                            <span class="text-gray-600">/</span>
                            <button @click="navigateTo(currentPath.split('/').filter(Boolean).slice(0, i+1).join('/'))" class="text-indigo-400 hover:text-indigo-300" x-text="seg"></button>
                        </span>
                    </template>
                </div>
                <span class="text-xs text-gray-500" x-text="files.length + ' 项'"></span>
            </div>
            <div class="divide-y divide-gray-700">
                <template x-for="f in files" :key="f.path || f.name">
                    <div @click="openFile(f)" class="flex items-center gap-3 px-4 py-3 hover:bg-gray-700/30 cursor-pointer transition">
                        <i :class="f.is_dir ? 'fas fa-folder text-yellow-500' : 'fas fa-file-code text-blue-400'" class="w-5 text-center"></i>
                        <span class="flex-1 text-sm text-gray-300" x-text="f.name || f.path"></span>
                        <span class="text-xs text-gray-600" x-text="f.size ? (f.size / 1024).toFixed(1) + ' KB' : ''"></span>
                    </div>
                </template>
            </div>
            <div x-show="!files.length && !loading" class="text-center py-8 text-gray-500 text-sm">无文件</div>
        </div>
    </template>

    <!-- File Content Modal -->
    <div x-show="showFileModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showFileModal=false">
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-3xl mx-4 max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
                <h3 class="text-white font-medium"><i class="fas fa-file-code mr-2 text-blue-400"></i><span x-text="fileContent?.file_path"></span></h3>
                <button @click="showFileModal=false" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-auto p-4"><pre class="text-sm text-green-400 font-mono whitespace-pre-wrap" x-text="fileContent?.content || '加载中...'"></pre></div>
        </div>
    </div>
</div>
<script>
window.adminNasPage = function() {
    return { projects: [], selectedProjectId: '', files: [], currentPath: '', loading: false, showFileModal: false, fileContent: null,
        async init() { await this.loadProjects() },
        async loadProjects() { try { const r = await fetch('/api/projects?limit=100'); if (r.ok) this.projects = (await r.json()).items || [] } catch(e) {} },
        async loadProjectFiles() {
            if (!this.selectedProjectId) return
            this.loading = true; this.currentPath = ''
            try { const r = await fetch('/api/projects/' + this.selectedProjectId + '/files?path=' + encodeURIComponent(this.currentPath)); if (r.ok) { const d = await r.json(); this.files = d.files || [] } } catch(e) {}
            finally { this.loading = false }
        },
        navigateTo(p) { this.currentPath = p; this.loadProjectFiles() },
        async openFile(f) {
            if (f.is_dir) { this.currentPath = f.path || f.name; await this.loadProjectFiles(); return }
            try {
                const r = await fetch('/api/projects/' + this.selectedProjectId + '/files/' + encodeURIComponent(f.path || f.name))
                if (r.ok) { this.fileContent = await r.json(); this.showFileModal = true }
            } catch(e) {}
        }
    }
}
</script>
