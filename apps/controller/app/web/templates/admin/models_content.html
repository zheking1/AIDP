<div x-data="adminModelsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">模型管理</h1>
            <p class="text-gray-400 text-sm mt-1">管理 LLM 模型和 API 配置</p>
        </div>
        <button @click="openCreate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
            <i class="fas fa-plus"></i>新建模型
        </button>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">模型</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">端点</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Key</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">状态</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                <template x-for="m in models" :key="m.id">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-6 py-4 text-sm font-medium text-white" x-text="m.name"></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="m.model_name"></td>
                        <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" x-text="m.api_base || '-'"></td>
                        <td class="px-6 py-4 text-sm text-gray-400 font-mono" x-text="m.api_key || '-'"></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full" :class="m.status==='active' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'" x-text="m.status==='active' ? '正常' : '异常'"></span></td>
                        <td class="px-6 py-4 text-right">
                            <button @click="editModel(m)" class="text-gray-400 hover:text-indigo-400 text-sm mr-3"><i class="fas fa-edit"></i></button>
                            <button @click="deleteModel(m)" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="!models.length && !loading" class="text-center py-12 text-gray-500"><i class="fas fa-microchip text-4xl text-gray-700 mb-4"></i><p>暂无模型</p></div>
    </div>
    <div x-show="showModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showModal=false">
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-lg mx-4 p-6 space-y-4">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-white font-medium"><i class="fas fa-microchip mr-2 text-indigo-400"></i><span x-text="editId ? '编辑模型' : '新建模型'"></span></h3>
                <button @click="showModal=false" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div><label class="text-sm text-gray-400 block mb-1">名称</label><input type="text" x-model="form.name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
            <div><label class="text-sm text-gray-400 block mb-1">模型名称</label><input type="text" x-model="form.model_name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="gpt-4o"></div>
            <div><label class="text-sm text-gray-400 block mb-1">API 端点</label><input type="text" x-model="form.api_base" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="https://api.openai.com/v1"></div>
            <div><label class="text-sm text-gray-400 block mb-1">API Key</label><input type="password" x-model="form.api_key" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
            <div class="flex justify-end gap-2 pt-2"><button @click="showModal=false" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">取消</button><button @click="saveModel()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm">保存</button></div>
        </div>
    </div>
</div>
<script>
window.adminModelsPage = function() {
    return { models: [], loading: false, showModal: false, editId: null, form: { name: '', model_name: '', api_base: '', api_key: '' }, original_key: '',
        async init() { await this.load() },
        async load() {
            this.loading = true
            try { const r = await fetch('/api/models'); if (r.ok) this.models = (await r.json()).items || [] } catch(e) {}
            finally { this.loading = false }
        },
        openCreate() { this.editId = null; this.original_key = ''; this.form = { name: '', model_name: '', api_base: '', api_key: '' }; this.showModal = true },
        editModel(m) { this.editId = m.id; this.original_key = m.api_key || ''; this.form = { name: m.name, model_name: m.model_name, api_base: m.api_base || '', api_key: m.api_key || '' }; this.showModal = true },
        async saveModel() {
            try {
                const url = this.editId ? '/api/models/' + this.editId : '/api/models'
                const method = this.editId ? 'PUT' : 'POST'
                const body = { ...this.form }
                if (this.editId && this.form.api_key === this.original_key) { delete body.api_key }
                const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                if (r.ok) { this.showModal = false; await this.load() }
            } catch(e) {}
        },
        async deleteModel(m) { if (!confirm('删除模型「' + m.name + '」？')) return; try { await fetch('/api/models/' + m.id, { method: 'DELETE' }); await this.load() } catch(e) {} }
    }
}
</script>
