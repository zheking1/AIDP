<div x-data="settingsManager()" x-init="loadSettings()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">系统设置</h1>
            <p class="text-gray-400 mt-1">配置全局系统参数</p>
        </div>
        <button @click="saveSettings()" :disabled="saving" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg font-medium transition">
            <i class="fas fa-save mr-2" :class="saving ? 'fa-spin' : ''"></i><span x-text="saving ? '保存中...' : '保存设置'"></span>
        </button>
    </div>

    <div class="space-y-6">
        <!-- Site Settings -->
        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
            <h2 class="text-lg font-semibold text-white mb-4"><i class="fas fa-globe mr-2 text-indigo-400"></i>站点信息</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">站点名称</label>
                    <input type="text" x-model="settings.siteName" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">站点描述</label>
                    <input type="text" x-model="settings.siteDescription" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>

        <!-- Auth Settings -->
        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
            <h2 class="text-lg font-semibold text-white mb-4"><i class="fas fa-shield-alt mr-2 text-indigo-400"></i>认证设置</h2>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-white">开放注册</div>
                        <div class="text-sm text-gray-500">允许新用户自行注册</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" x-model="settings.allowRegistration" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-white">需要审核</div>
                        <div class="text-sm text-gray-500">新用户注册需要管理员审核</div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" x-model="settings.requireApproval" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        function settingsManager() {
            return {
                saving: false,
                settings: {
                    siteName: 'AIDP',
                    siteDescription: 'AI DevOps Platform',
                    allowRegistration: false,
                    requireApproval: true
                },

                async loadSettings() {
                    try {
                        const response = await fetch('/api/settings');
                        if (response.ok) {
                            const data = await response.json();
                            Object.assign(this.settings, data);
                        }
                    } catch (e) {
                        console.error('Failed to load settings:', e);
                    }
                },

                async saveSettings() {
                    this.saving = true;
                    try {
                        const response = await fetch('/api/settings', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.settings)
                        });
                        if (response.ok) {
                            alert('设置已保存');
                        } else {
                            alert('保存失败');
                        }
                    } catch (e) {
                        console.error('Failed to save settings:', e);
                        alert('保存失败: ' + e.message);
                    } finally {
                        this.saving = false;
                    }
                }
            }
        }
    </script>
</div>
