<div x-data="adminInstructionsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">指令管理</h1>
            <p class="text-gray-400 text-sm mt-1">管理全局 Agent 指令模板</p>
        </div>
        <button @click="openCreate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
            <i class="fas fa-plus"></i>新建指令
        </button>
    </div>

    <!-- Table -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Agent 类型</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">角色</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">规则数</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                <template x-for="item in items" :key="item.id">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-6 py-4 text-sm font-medium text-white" x-text="item.name || item.agent_type"></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full bg-indigo-500/20 text-indigo-400" x-text="item.agent_type"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" x-text="item.role?.substring(0, 60)"></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="(item.rules || []).length"></td>
                        <td class="px-6 py-4 text-right">
                            <button @click="editItem(item)" class="text-gray-400 hover:text-indigo-400 text-sm mr-3"><i class="fas fa-edit"></i></button>
                            <button @click="deleteItem(item)" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="!items.length && !loading" class="text-center py-12 text-gray-500"><i class="fas fa-book text-4xl text-gray-700 mb-4"></i><p>暂无指令</p></div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showModal=false">
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-2xl mx-4 max-h-[85vh] overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
                <h3 class="text-white font-medium"><i class="fas fa-book mr-2 text-indigo-400"></i><span x-text="editId ? '编辑指令' : '新建指令'"></span></h3>
                <button @click="showModal=false" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-4">
                <div><label class="text-sm text-gray-400 block mb-1">名称</label><input type="text" x-model="form.name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
                <div><label class="text-sm text-gray-400 block mb-1">Agent 类型</label><input type="text" x-model="form.agent_type" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
                <div><label class="text-sm text-gray-400 block mb-1">角色定义 (Role)</label><textarea x-model="form.role" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></textarea></div>
                <div><label class="text-sm text-gray-400 block mb-1">约束条件 (JSON)</label><textarea x-model="form.constraints_str" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></textarea></div>
                <div><label class="text-sm text-gray-400 block mb-1">规则列表 (JSON, 每行一条)</label><textarea x-model="form.rules_str" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></textarea></div>
            </div>
            <div class="px-6 py-4 border-t border-gray-700 flex justify-end gap-2">
                <button @click="showModal=false" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">取消</button>
                <button @click="saveItem()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm">保存</button>
            </div>
        </div>
    </div>
</div>
<script>
window.adminInstructionsPage = function() {
    return {
        items: [], loading: false, showModal: false, editId: null,
        form: { name: '', agent_type: 'main', role: '', constraints_str: '{}', rules_str: '' },
        async init() { await this.load() },
        async load() {
            this.loading = true
            try { const r = await fetch('/api/instructions/list'); if (r.ok) this.items = (await r.json()).items || [] } catch(e) {}
            finally { this.loading = false }
        },
        openCreate() { this.editId = null; this.form = { name: '', agent_type: 'main', role: '', constraints_str: '{}', rules_str: '' }; this.showModal = true },
        editItem(item) {
            this.editId = item.id
            this.form = {
                name: item.name || '', agent_type: item.agent_type || 'main', role: item.role || '',
                constraints_str: JSON.stringify(item.constraints || {}, null, 2),
                rules_str: (item.rules || []).join('\n')
            }
            this.showModal = true
        },
        async saveItem() {
            const body = {
                name: this.form.name, agent_type: this.form.agent_type, role: this.form.role,
                constraints: JSON.parse(this.form.constraints_str || '{}'),
                rules: this.form.rules_str.split('\n').filter(Boolean)
            }
            try {
                const url = this.editId ? '/api/instructions/' + this.editId : '/api/instructions'
                const method = this.editId ? 'PUT' : 'POST'
                const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                if (r.ok) { this.showModal = false; await this.load() }
            } catch(e) {}
        },
        async deleteItem(item) {
            if (!confirm('删除指令「' + (item.name || item.agent_type) + '」？')) return
            try { const r = await fetch('/api/instructions/' + item.id, { method: 'DELETE' }); if (r.ok) await this.load() } catch(e) {}
        }
    }
}
</script>
