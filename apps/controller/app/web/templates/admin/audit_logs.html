{% if embed %}{% extends "layouts/embed.html" %}{% else %}{% extends "layouts/unified_base.html" %}{% endif %}
{% block title %}审计日志 - AIDP{% endblock %}
{% block content %}
<div class="min-h-screen" x-data="auditLogsPage()" x-init="init()">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-white">审计日志</h1>
      <div class="flex gap-2">
        <select x-model="filterAction" @change="loadLogs()" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">全部操作</option>
          <option value="create">创建</option>
          <option value="update">更新</option>
          <option value="delete">删除</option>
          <option value="login">登录</option>
          <option value="execute">执行</option>
        </select>
        <button @click="loadLogs()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700"><i class="fas fa-sync mr-1"></i>刷新</button>
      </div>
    </div>
    <div class="bg-gray-800 rounded-lg border shadow-sm overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">时间</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">用户</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">操作</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">资源</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">详情</th>
          </tr>
        </thead>
        <tbody class="bg-gray-800 divide-y divide-gray-200">
          <template x-for="log in logs" :key="log.id">
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 text-sm text-gray-400 whitespace-nowrap" x-text="log.created_at?.substring(0, 19)"></td>
              <td class="px-6 py-4 text-sm text-white" x-text="log.user_id || '-'"></td>
              <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-700 capitalize" x-text="log.action"></span></td>
              <td class="px-6 py-4 text-sm text-gray-400" x-text="log.resource_type + ':' + log.resource_id?.substring(0,8)"></td>
              <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" x-text="log.detail ? JSON.stringify(log.detail) : '-'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
function auditLogsPage() {
  return { logs: [], filterAction: '',
    async init() { this.loadLogs() },
    async loadLogs() {
      try {
        const params = new URLSearchParams({limit:'50'});
        if(this.filterAction) params.set('action', this.filterAction);
        const r = await fetch('/api/audit/logs?'+params);
        if(r.ok) this.logs = (await r.json()).items || [];
      } catch(e){}
    }
  };
}
</script>
{% endblock %}
