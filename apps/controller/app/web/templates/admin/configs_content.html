<div x-data="adminConfigsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">环境配置</h1>
            <p class="text-gray-400 text-sm mt-1">管理项目环境变量和配置</p>
        </div>
        <select x-model="selectedProjectId" @change="loadConfigs()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300 min-w-[200px]">
            <option value="">选择项目...</option>
            <template x-for="p in projects" :key="p.id">
                <option :value="p.id" x-text="p.name"></option>
            </template>
        </select>
    </div>
    <div x-show="!selectedProjectId" class="text-center py-16 text-gray-500"><i class="fas fa-cog text-5xl text-gray-700 mb-4"></i><p>请先选择一个项目</p></div>
    <template x-if="selectedProjectId">
        <div>
            <div class="flex gap-2 mb-4">
                <select x-model="filterEnv" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300">
                    <option value="">全部环境</option>
                    <option value="development">开发</option>
                    <option value="staging">预发布</option>
                    <option value="production">生产</option>
                    <option value="testing">测试</option>
                </select>
                <button @click="openCreate()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-plus mr-1"></i>新建配置</button>
            </div>
            <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="bg-gray-700/50">
                        <tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">环境</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">键</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">值</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th></tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700">
                        <template x-for="c in filteredConfigs" :key="c.id">
                            <tr class="hover:bg-gray-700/30">
                                <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full" :class="{'bg-blue-500/20 text-blue-400': c.env_type==='development','bg-yellow-500/20 text-yellow-400': c.env_type==='staging','bg-red-500/20 text-red-400': c.env_type==='production','bg-green-500/20 text-green-400': c.env_type==='testing'}" x-text="c.env_type"></span></td>
                                <td class="px-6 py-4 text-sm font-mono text-white" x-text="c.config_key"></td>
                                <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate font-mono" x-text="c.config_value?.substring(0, 60)"></td>
                                <td class="px-6 py-4 text-right"><button @click="deleteConfig(c)" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-trash"></i></button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div x-show="!filteredConfigs.length && !loading" class="text-center py-8 text-gray-500 text-sm">暂无配置</div>
            </div>
        </div>
    </template>
    <div x-show="showCreate" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showCreate=false">
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-lg mx-4 p-6 space-y-4">
            <div class="flex items-center justify-between"><h3 class="text-white font-medium"><i class="fas fa-plus mr-2 text-indigo-400"></i>新建配置</h3><button @click="showCreate=false" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button></div>
            <div><label class="text-sm text-gray-400 block mb-1">环境</label><select x-model="newConfig.env_type" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm"><option value="development">开发</option><option value="staging">预发布</option><option value="production">生产</option><option value="testing">测试</option></select></div>
            <div><label class="text-sm text-gray-400 block mb-1">键</label><input type="text" x-model="newConfig.config_key" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono" placeholder="DATABASE_URL"></div>
            <div><label class="text-sm text-gray-400 block mb-1">值</label><textarea x-model="newConfig.config_value" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono"></textarea></div>
            <div class="flex justify-end gap-2"><button @click="showCreate=false" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">取消</button><button @click="createConfig()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm">创建</button></div>
        </div>
    </div>
</div>
<script>
window.adminConfigsPage = function() {
    return {
        projects: [], selectedProjectId: '', configs: [], loading: false, filterEnv: '', showCreate: false,
        newConfig: { env_type: 'development', config_key: '', config_value: '' },
        get filteredConfigs() { return this.filterEnv ? this.configs.filter(c => c.env_type === this.filterEnv) : this.configs },
        async init() { await this.loadProjects() },
        async loadProjects() { try { const r = await fetch('/api/projects?limit=100'); if (r.ok) this.projects = (await r.json()).items || [] } catch(e) {} },
        async loadConfigs() {
            if (!this.selectedProjectId) return
            this.loading = true
            try { const r = await fetch('/api/projects/' + this.selectedProjectId + '/configs/'); if (r.ok) { const d = await r.json(); this.configs = d.configs || [] } } catch(e) {}
            finally { this.loading = false }
        },
        openCreate() { this.newConfig = { env_type: 'development', config_key: '', config_value: '' }; this.showCreate = true },
        async createConfig() {
            try { const r = await fetch('/api/projects/' + this.selectedProjectId + '/configs/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.newConfig) }); if (r.ok) { this.showCreate = false; await this.loadConfigs() } } catch(e) {}
        },
        async deleteConfig(c) { if (!confirm('删除配置 ' + c.config_key + '？')) return; try { await fetch('/api/projects/' + this.selectedProjectId + '/configs/' + c.env_type + '?key=' + c.config_key, { method: 'DELETE' }); await this.loadConfigs() } catch(e) {} }
    }
}
</script>
