<div x-data="adminProjectsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">项目管理</h1>
            <p class="text-gray-400 text-sm mt-1">管理系统中的所有项目</p>
        </div>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">创建者</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">创建时间</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="bg-gray-800 divide-y divide-gray-700">
                <template x-for="p in projects" :key="p.id">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="p.id"></td>
                        <td class="px-6 py-4"><span class="text-sm font-medium text-white" x-text="p.name"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="p.user_id || '-'"></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full" :class="p.deleted_at ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'" x-text="p.deleted_at ? '已删除' : '正常'"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="p.created_at?.substring(0, 10)"></td>
                        <td class="px-6 py-4 text-right"><button @click="deleteProject(p)" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-trash mr-1"></i>删除</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="projects.length === 0" class="text-center py-12 text-gray-500"><i class="fas fa-folder text-4xl mb-4 text-gray-600"></i><p>暂无项目</p></div>
    </div>
</div>
<script>
function adminProjectsPage() {
  return { projects: [],
    async init() { try { const r = await fetch('/api/projects?limit=100'); if(r.ok) this.projects = (await r.json()).items || []; } catch(e){} },
    async deleteProject(p) { if(!p || !confirm('确定删除项目 '+p.name+'？')) return; try { await fetch('/api/projects/'+p.id, {method:'DELETE'}); this.init(); } catch(e){} }
  };
}
</script>
