<!-- User Management - Frame Content -->
<div class="p-6" x-data="usersManager()" x-init="loadUsers()">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">用户管理</h1>
            <p class="text-sm text-gray-400 mt-1">管理系统用户和权限</p>
        </div>
        <button @click="showCreateModal = true" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">
            <i class="fas fa-plus mr-2"></i>创建用户
        </button>
    </div>

    <!-- Users Table -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-700/50 text-gray-400">
                <tr>
                    <th class="px-4 py-3 font-medium">用户</th>
                    <th class="px-4 py-3 font-medium">角色</th>
                    <th class="px-4 py-3 font-medium">状态</th>
                    <th class="px-4 py-3 font-medium">创建时间</th>
                    <th class="px-4 py-3 font-medium">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                <template x-for="user in users" :key="user.id">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-indigo-500/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user text-indigo-400 text-sm"></i>
                                </div>
                                <div>
                                    <div class="text-white font-medium" x-text="user.nickname || user.username"></div>
                                    <div class="text-xs text-gray-500" x-text="user.username"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-xs font-medium"
                                  :class="{
                                      'bg-purple-500/20 text-purple-400': user.role === 'super_admin',
                                      'bg-blue-500/20 text-blue-400': user.role === 'admin',
                                      'bg-green-500/20 text-green-400': user.role === 'developer',
                                      'bg-gray-500/20 text-gray-400': user.role === 'user'
                                  }"
                                  x-text="user.role">
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded text-xs font-medium"
                                  :class="user.status === 'active' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'"
                                  x-text="user.status">
                            </span>
                        </td>
                        <td class="px-4 py-3 text-gray-400 text-sm" x-text="formatDate(user.created_at)"></td>
                        <td class="px-4 py-3">
                            <div class="flex gap-2">
                                <button @click="editUser(user)" class="text-gray-400 hover:text-white transition"><i class="fas fa-edit"></i></button>
                                <button @click="deleteUser(user.id)" class="text-gray-400 hover:text-red-400 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Create User Modal -->
    <div x-show="showCreateModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" x-cloak>
        <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md border border-gray-700">
            <h2 class="text-xl font-bold text-white mb-4">创建用户</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">用户名</label>
                    <input type="text" x-model="newUser.username" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">密码</label>
                    <input type="password" x-model="newUser.password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">角色</label>
                    <select x-model="newUser.role" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                        <option value="user">普通用户</option>
                        <option value="developer">开发者</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button @click="showCreateModal = false" class="px-4 py-2 text-gray-400 hover:text-white transition">取消</button>
                <button @click="createUser()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">创建</button>
            </div>
        </div>
    </div>

    <script>
        function usersManager() {
            return {
                users: [],
                showCreateModal: false,
                newUser: { username: '', password: '', role: 'user' },

                async loadUsers() {
                    try {
                        const response = await fetch('/api/auth/users');
                        if (response.ok) {
                            this.users = await response.json();
                        }
                    } catch (e) {
                        console.error('Failed to load users:', e);
                        // Use sample data for demo
                        this.users = [
                            { id: 1, username: 'admin', nickname: 'Administrator', role: 'super_admin', status: 'active', created_at: '2026-01-01' },
                            { id: 2, username: 'dev1', nickname: 'Developer 1', role: 'developer', status: 'active', created_at: '2026-01-15' },
                        ];
                    }
                },

                formatDate(date) {
                    return new Date(date).toLocaleDateString('zh-CN');
                },

                async createUser() {
                    try {
                        const response = await fetch('/api/auth/users', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newUser)
                        });
                        if (response.ok) {
                            this.showCreateModal = false;
                            this.loadUsers();
                        }
                    } catch (e) {
                        console.error('Failed to create user:', e);
                    }
                },

                editUser(user) {
                    // TODO: Implement edit
                    alert('编辑用户: ' + user.username);
                },

                async deleteUser(id) {
                    if (!confirm('确定要删除这个用户吗？')) return;
                    try {
                        await fetch(`/api/auth/users/${id}`, { method: 'DELETE' });
                        this.loadUsers();
                    } catch (e) {
                        console.error('Failed to delete user:', e);
                    }
                }
            }
        }
    </script>
</div>
