<div x-data="adminSkillsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">全局技能管理</h1>
            <p class="text-gray-400 text-sm mt-1">管理系统中的全局技能</p>
        </div>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">作用域</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">版本</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">审核</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">访问</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="bg-gray-800 divide-y divide-gray-700">
                <template x-for="s in skills" :key="s.id">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-6 py-4"><span class="text-sm font-medium text-white" x-text="s.name"></span></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full bg-purple-500/20 text-purple-400" x-text="s.scope"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400">v<span x-text="s.version"></span></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full" :class="s.review_status==='approved'?'bg-green-500/20 text-green-400':'bg-yellow-500/20 text-yellow-400'" x-text="s.review_status"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="s.access_count"></td>
                        <td class="px-6 py-4 text-right"><button @click="deleteSkill(s)" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-trash mr-1"></i>删除</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
<script>
function adminSkillsPage() {
  return { skills: [],
    async init() { try { const r = await fetch('/api/skills/list?scope=global&limit=100'); if(r.ok) this.skills = (await r.json()).items || []; } catch(e){} },
    async deleteSkill(s) { if(!s || !confirm('删除 '+s.name+'？')) return; try { await fetch('/api/skills/'+s.id, {method:'DELETE'}); this.init() } catch(e){} }
  };
}
</script>
