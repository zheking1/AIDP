<div x-data="adminToolsPage()" x-init="init()">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">工具管理</h1>
            <p class="text-gray-400 text-sm mt-1">注册和管理系统工具</p>
        </div>
        <button @click="openRegister()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
            <i class="fas fa-plus"></i>注册工具
        </button>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">端点</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">版本</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                <template x-for="tool in tools" :key="tool.name">
                    <tr class="hover:bg-gray-700/30">
                        <td class="px-6 py-4 text-sm font-medium text-white" x-text="tool.name"></td>
                        <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" x-text="tool.endpoint"></td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded-full" :class="tool.healthy ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'" x-text="tool.healthy ? '正常' : '异常'"></span></td>
                        <td class="px-6 py-4 text-sm text-gray-400" x-text="tool.version || '-'"></td>
                        <td class="px-6 py-4 text-right">
                            <button @click="checkHealth(tool)" class="text-gray-400 hover:text-green-400 text-sm mr-2" title="健康检查"><i class="fas fa-heartbeat"></i></button>
                            <button @click="toggleTool(tool)" class="text-sm mr-2" :class="tool.enabled ? 'text-gray-400 hover:text-yellow-400' : 'text-gray-600'" :title="tool.enabled ? '禁用' : '启用'"><i :class="tool.enabled ? 'fas fa-toggle-on' : 'fas fa-toggle-off'"></i></button>
                            <button @click="deleteTool(tool)" class="text-gray-400 hover:text-red-400 text-sm"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="!tools.length && !loading" class="text-center py-12 text-gray-500"><i class="fas fa-plug text-4xl text-gray-700 mb-4"></i><p>暂无已注册工具</p></div>
    </div>
    <div x-show="showRegister" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showRegister=false">
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-lg mx-4 p-6 space-y-4">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-white font-medium"><i class="fas fa-plug mr-2 text-indigo-400"></i>注册工具</h3>
                <button @click="showRegister=false" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div><label class="text-sm text-gray-400 block mb-1">工具名称</label><input type="text" x-model="regForm.name" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
            <div><label class="text-sm text-gray-400 block mb-1">端点 URL</label><input type="text" x-model="regForm.endpoint" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="http://localhost:8000"></div>
            <div><label class="text-sm text-gray-400 block mb-1">描述</label><textarea x-model="regForm.description" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></textarea></div>
            <div><label class="text-sm text-gray-400 block mb-1">版本</label><input type="text" x-model="regForm.version" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="1.0.0"></div>
            <div class="flex justify-end gap-2 pt-2"><button @click="showRegister=false" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">取消</button><button @click="registerTool()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm">注册</button></div>
        </div>
    </div>
</div>
<script>
window.adminToolsPage = function() {
    return { tools: [], loading: false, showRegister: false, regForm: { name: '', endpoint: '', description: '', version: '1.0.0' },
        async init() { await this.load() },
        async load() {
            this.loading = true
            try { const r = await fetch('/api/tools'); if (r.ok) this.tools = (await r.json()).tools || (await r.json()).items || [] } catch(e) {}
            finally { this.loading = false }
        },
        openRegister() { this.regForm = { name: '', endpoint: '', description: '', version: '1.0.0' }; this.showRegister = true },
        async registerTool() {
            try {
                const r = await fetch('/api/tools', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(this.regForm) })
                if (r.ok) { this.showRegister = false; await this.load() }
            } catch(e) {}
        },
        async checkHealth(tool) {
            try { const r = await fetch('/api/tools/' + tool.name + '/health', { method: 'POST' }); if (r.ok) await this.load(); else alert('健康检查失败') } catch(e) { alert('连接失败') }
        },
        async toggleTool(tool) {
            const action = tool.enabled ? 'disable' : 'enable'
            try { const r = await fetch('/api/tools/' + tool.name + '/' + action, { method: 'POST' }); if (r.ok) await this.load() } catch(e) {}
        },
        async deleteTool(tool) { if (!confirm('删除工具「' + tool.name + '」？')) return; try { await fetch('/api/tools/' + tool.name, { method: 'DELETE' }); await this.load() } catch(e) {} }
    }
}
</script>
