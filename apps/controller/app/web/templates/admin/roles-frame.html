<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #111827; color: #f3f4f6; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen">
<div class="p-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">角色权限</h1>
        <p class="text-gray-400 mt-1">管理用户角色和权限配置</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-purple-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-crown text-purple-400"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-white">super_admin</h3>
                    <p class="text-xs text-gray-500">系统角色</p>
                </div>
            </div>
            <p class="text-sm text-gray-400 mb-4">拥有所有权限</p>
            <div class="flex flex-wrap gap-2">
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">全部权限</span>
            </div>
        </div>
        
        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-shield text-blue-400"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-white">admin</h3>
                    <p class="text-xs text-gray-500">系统角色</p>
                </div>
            </div>
            <p class="text-sm text-gray-400 mb-4">可管理用户和配置</p>
            <div class="flex flex-wrap gap-2">
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">用户管理</span>
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">配置管理</span>
            </div>
        </div>
        
        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-green-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-code text-green-400"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-white">developer</h3>
                    <p class="text-xs text-gray-500">系统角色</p>
                </div>
            </div>
            <p class="text-sm text-gray-400 mb-4">可使用工具和执行代码</p>
            <div class="flex flex-wrap gap-2">
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">工具使用</span>
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">代码执行</span>
            </div>
        </div>
        
        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gray-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user text-gray-400"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-white">user</h3>
                    <p class="text-xs text-gray-500">系统角色</p>
                </div>
            </div>
            <p class="text-sm text-gray-400 mb-4">只读访问权限</p>
            <div class="flex flex-wrap gap-2">
                <span class="px-2 py-1 bg-gray-700 rounded text-xs text-gray-300">查看</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
