<div x-data="knowledgeSearchPage()" x-init="init()">
<!-- Header -->
<div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">知识搜索</h1>
            <p class="text-gray-400 text-sm mt-1">语义搜索您的知识库</p>
        
    </div>

    <!-- Search Section -->
    <div class="py-8">
        <div class="relative">
            <input x-model="query" 
                   @keydown.enter="search()"
                   type="text" 
                   placeholder="输入关键词搜索文档..." 
                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-6 py-4 text-lg text-white placeholder-gray-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
            <button @click="search()" 
                    :disabled="searching"
                    class="absolute right-3 top-1/2 -translate-y-1/2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-6 py-2 rounded-lg transition flex items-center gap-2">
                <span x-show="searching" class="loading-spinner w-4 h-4 border-2"></span>
                <i x-show="!searching" class="fas fa-search"></i>
                <span x-text="searching ? '搜索中...' : '搜索'"></span>
            </button>
        </div>

        <!-- Filters -->
        <div class="flex gap-4 mt-4">
            <select x-model="filters.kb_id" 
                    @change="search()"
                    class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-indigo-500 focus:outline-none">
                <option value="">全部知识库</option>
                <template x-for="kb in knowledgeBases" :key="kb.id">
                    <option :value="kb.id" x-text="kb.name"></option>
                </template>
            </select>
            <select x-model="filters.top_k" 
                    @change="search()"
                    class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:border-indigo-500 focus:outline-none">
                <option value="5">5 条结果</option>
                <option value="10">10 条结果</option>
                <option value="20">20 条结果</option>
            </select>
        </div>
    </div>

    <!-- Results -->
    <div class="pb-8">
        <!-- Initial State -->
        <div x-show="!hasSearched && !searching" class="text-center py-12">
            <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-search text-4xl text-gray-600"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-300 mb-2">开始搜索</h3>
            <p class="text-gray-500">输入关键词查找相关文档</p>
        </div>

        <!-- Loading -->
        <div x-show="searching" class="flex justify-center py-12">
            <div class="loading-spinner w-8 h-8"></div>
        </div>

        <!-- Results List -->
        <div x-show="hasSearched && !searching && results.length > 0" class="space-y-4">
            <div class="flex items-center justify-between text-sm text-gray-400 mb-4">
                <span>找到 <span x-text="total" class="text-white font-medium"></span> 个结果</span>
                <span>耗时 <span x-text="searchTime"></span>ms</span>
            </div>

            <template x-for="(result, index) in results" :key="index">
                <div class="bg-gray-800 rounded-lg border border-gray-700 p-5 hover:border-indigo-500/50 transition cursor-pointer"
                     @click="viewResult(result)">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 bg-indigo-600/20 rounded-lg flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-file-alt text-indigo-400"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-semibold text-lg text-white" x-text="result.document.title"></h3>
                                <span class="text-xs bg-indigo-600/20 text-indigo-400 px-2 py-0.5 rounded">
                                    相似度: <span x-text="(result.score * 100).toFixed(1)"></span>%
                                </span>
                            </div>
                            <p class="text-gray-400 text-sm mb-2 line-clamp-2" x-text="result.document.description || result.document.content || '无摘要'"></p>
                            <div class="flex items-center gap-4 text-xs text-gray-500">
                                <span><i class="fas fa-folder mr-1"></i> <span x-text="result.document.base_id || '未分类'"></span></span>
                                <span><i class="fas fa-clock mr-1"></i> <span x-text="formatDate(result.document.updated_at)"></span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- No Results -->
        <div x-show="hasSearched && !searching && results.length === 0" class="text-center py-12">
            <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-inbox text-3xl text-gray-600"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-300 mb-2">未找到结果</h3>
            <p class="text-gray-500">尝试使用不同的关键词</p>
        </div>
    </div>

    <!-- View Result Modal -->
    <div x-show="showViewModal" 
         class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
         x-transition>
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-4xl mx-4 max-h-[90vh] overflow-hidden flex flex-col">
            
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
                <div>
                    <h2 class="text-xl font-semibold" x-text="viewingResult?.document?.title"></h2>
                    <p class="text-sm text-gray-400 mt-1">
                        相似度: <span x-text="(viewingResult?.score * 100).toFixed(1)"></span>%
                    </p>
                </div>
                <button @click="showViewModal = false" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6">
                <div class="prose prose-invert max-w-none">
                    <pre class="bg-gray-900 p-4 rounded-lg overflow-x-auto"><code x-text="viewingResult?.document?.content"></code></pre>
                </div>
            </div>
        </div>
    </div>

<style>
.loading-spinner {
    border: 2px solid #374151;
    border-top: 2px solid #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.prose pre {
    background-color: #111827;
}
</style>
<script>window.knowledgeSearchPage=function(){
  return{
    query:'',results:[],searching:false,hasSearched:false,total:0,searchTime:0,
    showViewModal:false,viewingResult:null,
    filters:{kb_id:'',top_k:10},
    knowledgeBases:[],

    async init(){
      try{
        var r=await fetch('/api/knowledge/bases?limit=100');
        if(r.ok)this.knowledgeBases=(await r.json()).items||[]
      }catch(e){}
    },

    async search(){
      if(!this.query.trim())return;
      this.searching=true;this.hasSearched=true;
      var start=Date.now();
      try{
        var body={query:this.query,top_k:this.filters.top_k};
        var url='/api/knowledge/search';
        var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok){
          var d=await r.json();
          this.results=d.results||[];
          this.total=d.total||0;
        }
      }catch(e){console.error(e)}
      finally{
        this.searchTime=Date.now()-start;
        this.searching=false;
      }
    },

    viewResult(r){
      this.viewingResult=r;
      this.showViewModal=true;
    },

    formatDate(d){return d?new Date(d).toLocaleDateString('zh-CN'):''}
  }
};</script>
