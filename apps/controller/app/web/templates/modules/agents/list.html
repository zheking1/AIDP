<div x-data="agentsPage()" x-init="init()">
<div class="flex items-center justify-between">
    <div>
        <h1 class="text-2xl font-bold text-white">Agent 管理</h1>
        <p class="text-gray-400 text-sm mt-1">领域专家身份模板 — 技术栈分析自动生成, domain 匹配</p>
    </div>
    <button @click="openCreate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
        <i class="fas fa-plus mr-1"></i>创建 Agent
    </button>
</div>

<div class="grid grid-cols-4 gap-3 mb-6">
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-3">
        <div class="text-xs text-gray-500">Agent 总数</div>
        <div class="text-xl font-bold text-white" x-text="stats.total||0">0</div>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-3">
        <div class="text-xs text-gray-500">自动生成</div>
        <div class="text-xl font-bold text-emerald-400" x-text="stats.by_source?.auto||0">0</div>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-3">
        <div class="text-xs text-gray-500">手动创建</div>
        <div class="text-xl font-bold text-indigo-400" x-text="stats.by_source?.manual||0">0</div>
    </div>
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-3">
        <div class="text-xs text-gray-500">项目</div>
        <div class="text-xl font-bold text-green-400" x-text="stats.by_scope?.project||0">0</div>
    </div>
</div>

<div class="flex gap-3 mb-4">
    <div class="flex-1 relative">
        <i class="fas fa-search absolute left-3 top-2.5 text-gray-500"></i>
        <input type="text" x-model="searchQuery" @input.debounce.300ms="loadAgents()" placeholder="搜索 Agent..."
               class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 placeholder-gray-600">
    </div>
    <select x-model="scopeFilter" @change="loadAgents()" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300">
        <option value="">全部</option>
        <option value="project">项目</option>
        <option value="personal">个人</option>
        <option value="global">全局</option>
    </select>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <template x-for="agent in agents" :key="agent.id">
        <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 hover:border-indigo-500/50 transition cursor-pointer" @click="viewAgent(agent)">
            <div class="flex items-start gap-3 mb-2">
                <span class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0"
                      :class="agent.source==='auto'?'bg-emerald-500/10':'bg-indigo-500/10'">
                    <i class="fas fa-robot" :class="agent.source==='auto'?'text-emerald-400':'text-indigo-400'"></i>
                </span>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <h3 class="font-semibold text-white truncate" x-text="agent.name"></h3>
                        <span class="text-xs px-1.5 py-0.5 rounded"
                              :class="agent.source==='auto'?'bg-emerald-900/50 text-emerald-300':'bg-indigo-900/50 text-indigo-300'"
                              x-text="agent.source==='auto'?'自动':'手动'"></span>
                    </div>
                    <p class="text-xs text-gray-500 mt-0.5" x-text="agent.role||agent.agent_key"></p>
                </div>
            </div>
            <div class="flex gap-1 flex-wrap">
                <template x-for="t in (agent.domain_tags||[])">
                    <span class="px-1.5 py-0.5 text-xs bg-gray-700/60 text-gray-400 rounded" x-text="t"></span>
                </template>
            </div>
        </div>
    </template>
</div>
<div x-show="agents.length===0&&!loading" class="text-center py-16 text-gray-500">
    <i class="fas fa-robot text-5xl text-gray-700 mb-4"></i>
    <p>暂无 Agent</p>
    <p class="text-xs mt-1">运行 aidp_init 时系统会自动生成, 或点击上方手动创建</p>
</div>

<!-- Create Modal -->
<div x-show="showCreateModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-transition @click.self="showCreateModal=false">
    <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-lg mx-4 p-6 max-h-[85vh] overflow-y-auto">
        <h2 class="text-xl font-bold text-white mb-4">创建 Agent</h2>
        <div class="space-y-4">
            <div><label class="block text-sm text-gray-400 mb-1">名称 <span class="text-red-400">*</span></label>
                <input type="text" x-model="form.name" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm" placeholder="如: FastAPI 后端开发专家"></div>
            <div><label class="block text-sm text-gray-400 mb-1">标识 (agent_key) <span class="text-red-400">*</span></label>
                <input type="text" x-model="form.agent_key" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm font-mono" placeholder="fastapi-backend"></div>
            <div><label class="block text-sm text-gray-400 mb-1">角色 (role)</label>
                <input type="text" x-model="form.role" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm" placeholder="一句话定义"></div>
            <div><label class="block text-sm text-gray-400 mb-1">指令 (instructions)</label>
                <textarea x-model="form.instructions" rows="6" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm font-mono" placeholder="每行一条规则..."></textarea></div>
            <div><label class="block text-sm text-gray-400 mb-1">领域标签 (domain_tags)</label>
                <input type="text" x-model="form.domain_tags_str" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm" placeholder="backend,api,database (逗号分隔)"></div>
            <div><label class="block text-sm text-gray-400 mb-1">作用域</label>
                <select x-model="form.scope" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm">
                    <option value="project">项目</option>
                    <option value="personal">个人</option>
                    <option value="global">全局</option>
                </select></div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <button @click="showCreateModal=false" class="px-4 py-2 text-gray-400 hover:text-white text-sm">取消</button>
            <button @click="createAgent()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition">创建</button>
        </div>
    </div>
</div>

<script>window.agentsPage = function() {
    return {
        agents:[], searchQuery:'', scopeFilter:'project', loading:false, showCreateModal:false,
        stats:{total:0,by_source:{},by_scope:{}},
        form:{name:'',agent_key:'',role:'',instructions:'',domain_tags_str:'backend',scope:'project'},
        async init(){await this.loadAgents();await this.loadStats()},
        async loadAgents(){
            this.loading=true;
            try{
                const p=new URLSearchParams({scope:this.scopeFilter||'',limit:'100'});
                if(this.searchQuery)p.set('search',this.searchQuery);
                const r=await fetch('/api/agents/list?'+p);
                if(r.ok)this.agents=(await r.json()).items||[]
            }finally{this.loading=false}
        },
        async loadStats(){try{const r=await fetch('/api/agents/stats');if(r.ok)this.stats=await r.json()}catch(e){}},
        openCreate(){this.form={name:'',agent_key:'',role:'',instructions:'',domain_tags_str:'backend',scope:'project'};this.showCreateModal=true},
        async createAgent(){
            const tags=this.form.domain_tags_str.split(',').map(t=>t.trim()).filter(Boolean);
            try{
                const r=await fetch('/api/agents/create',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({name:this.form.name,agent_key:this.form.agent_key,role:this.form.role,
                        instructions:this.form.instructions,domain_tags:tags,scope:this.form.scope})});
                if(r.ok){this.showCreateModal=false;await this.loadAgents();await this.loadStats()}
            }catch(e){}
        },
        async viewAgent(a){
            try{const r=await fetch('/api/agents/'+a.id);if(r.ok){
                const d=await r.json();
                alert('Agent: '+d.name+'\nRole: '+(d.role||'')+'\nInstructions:\n'+(d.instructions||'').substring(0,1000)+
                    '\nDomain Tags: '+(d.domain_tags||[]).join(', ')+'\nSource: '+d.source)
            }}catch(e){}
        },
        async deleteAgent(a){if(!a||!confirm('删除 Agent「'+a.name+'」？'))return;
            try{await fetch('/api/agents/'+a.id,{method:'DELETE'});await this.loadAgents();await this.loadStats()}catch(e){}}
    }
}</script>
