<div x-data="memoryGraphPage()" x-init="init()">
    <div class="flex items-center justify-between pt-5 pb-4 border-b border-gray-700/50">
        <div class="flex items-center gap-4">
            <a href="javascript:void(0)" @click="history.back()" class="text-gray-400 hover:text-white">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-white">记忆图谱</h1>
                <p class="text-gray-400 text-sm mt-1">可视化记忆关联网络</p>
            </div>
        </div>
        <div class="flex gap-2">
                    <button @click="resetZoom()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-lg transition" title="重置视图">
                        <i class="fas fa-compress-arrows-alt"></i>
                    </button>
                    <button @click="togglePhysics()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-lg transition" title="切换物理模拟">
                        <i class="fas fa-pause" x-show="physicsEnabled"></i>
                        <i class="fas fa-play" x-show="!physicsEnabled"></i>
                    </button>
                </div>
            </div>

    <!-- Graph Container -->
    <div class="relative h-[calc(100vh-140px)]">
        <!-- D3 Graph -->
        <div id="graph-container" class="w-full h-full"></div>
        
        <!-- Legend -->
        <div class="absolute top-4 left-4 bg-gray-800/90 backdrop-blur rounded-lg border border-gray-700 p-4">
            <h3 class="text-sm font-medium mb-3">图例</h3>
            <div class="space-y-2 text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                    <span>架构</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500"></span>
                    <span>决策</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-purple-500"></span>
                    <span>模式</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                    <span>问题</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500"></span>
                    <span>Bug</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-gray-500"></span>
                    <span>其他</span>
                </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-gray-700">
                <div class="text-xs text-gray-400 mb-2">层级</div>
                <div class="flex items-center gap-2 text-sm">
                    <span class="w-4 h-4 rounded-full border-2 border-purple-400"></span>
                    <span>情景</span>
                </div>
                <div class="flex items-center gap-2 text-sm mt-1">
                    <span class="w-3 h-3 rounded-full border-2 border-blue-400"></span>
                    <span>语义</span>
                </div>
                <div class="flex items-center gap-2 text-sm mt-1">
                    <span class="w-2 h-2 rounded-full border-2 border-green-400"></span>
                    <span>程序</span>
                </div>
            </div>
        </div>
        
        <!-- Node Info Panel -->
        <div x-show="selectedNode" 
             class="absolute top-4 right-4 w-80 bg-gray-800/95 backdrop-blur rounded-lg border border-gray-700 p-4"
             x-transition>
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold" x-text="selectedNode?.label || '节点详情'"></h3>
                <button @click="selectedNode = null" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="space-y-3 text-sm">
                <div>
                    <span class="text-gray-400">分类:</span>
                    <span :class="getCategoryClass(selectedNode?.category)" 
                          class="ml-2 px-2 py-0.5 rounded text-xs capitalize"
                          x-text="selectedNode?.category"></span>
                </div>
                <div>
                    <span class="text-gray-400">层级:</span>
                    <span class="ml-2 capitalize" x-text="getTierText(selectedNode?.memory_tier)"></span>
                </div>
                <div>
                    <span class="text-gray-400">置信度:</span>
                    <span class="ml-2" x-text="(selectedNode?.confidence_score * 100).toFixed(0) + '%'"></span>
                </div>
                <div>
                    <span class="text-gray-400">访问次数:</span>
                    <span class="ml-2" x-text="selectedNode?.access_count"></span>
                </div>
                
                <div class="pt-3 border-t border-gray-700">
                    <button @click="viewMemoryDetail(selectedNode)" 
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition">
                        查看详情
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="absolute bottom-4 left-4 bg-gray-800/90 backdrop-blur rounded-lg border border-gray-700 px-4 py-2">
            <span class="text-sm text-gray-400">
                节点: <span x-text="graphData.nodes.length" class="text-white"></span> | 
                关系: <span x-text="graphData.links.length" class="text-white"></span>
            </span>
        </div>
    </div>

    <!-- Detail Modal -->
    <div x-show="showDetailModal" 
         class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
         x-transition>
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-2xl mx-4 max-h-[80vh] overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
                <h2 class="text-xl font-semibold" x-text="detailMemory?.title"></h2>
                <button @click="showDetailModal = false" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <div class="prose prose-invert max-w-none">
                    <p class="text-gray-300 whitespace-pre-wrap" x-text="detailMemory?.content"></p>
                </div>
            </div>
        </div>
    </div>

<script src="https://d3js.org/d3.v7.min.js"></script>


<style>
#graph-container {
    background: radial-gradient(circle at center, #1f2937 0%, #111827 100%);
}

#graph-container svg {
    display: block;
}

.nodes circle {
    transition: all 0.2s;
}

.nodes circle:hover {
    filter: brightness(1.2);
    stroke-width: 3;
}

.links line {
    transition: stroke-width 0.2s;
}
</style>



<style>
#graph-container {
    background: radial-gradient(circle at center, #1f2937 0%, #111827 100%);
}

#graph-container svg {
    display: block;
}

.nodes circle {
    transition: all 0.2s;
}

.nodes circle:hover {
    filter: brightness(1.2);
    stroke-width: 3;
}

.links line {
    transition: stroke-width 0.2s;
}
</style>
</script>
<script>window.memoryGraphPage=function memoryGraphPage() {
    return {
        graphData: { nodes: [], links: [] },
        selectedNode: null,
        showDetailModal: false,
        detailMemory: null,
        physicsEnabled: true,
        svg: null,
        simulation: null,
        
        init() {
            this.loadGraphData();
        },

        async loadGraphData() {
            try {
                const response = await fetch('/api/memory/graph?depth=2');
                if (response.ok) {
                    this.graphData = await response.json();
                    this.renderGraph();
                }
            } catch (error) {
                console.error('Failed to load graph data:', error);
            }
        },

        renderGraph() {
            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // 清除之前的图表
            d3.select('#graph-container').selectAll('*').remove();
            
            // 创建 SVG
            this.svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height)
                .attr('viewBox', [0, 0, width, height]);
            
            // 添加缩放行为
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });
            
            this.svg.call(zoom);
            
            const g = this.svg.append('g');
            
            // 颜色映射
            const colorMap = {
                'architecture': '#3b82f6',
                'decision': '#22c55e',
                'pattern': '#a855f7',
                'issue': '#eab308',
                'bug': '#ef4444',
                'other': '#6b7280'
            };
            
            // 层级大小映射
            const sizeMap = {
                'episodic': 12,
                'semantic': 8,
                'procedural': 5
            };
            
            // 创建力导向模拟
            this.simulation = d3.forceSimulation(this.graphData.nodes)
                .force('link', d3.forceLink(this.graphData.links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => (sizeMap[d.memory_tier] || 8) + 5));
            
            // 绘制连线
            const link = g.append('g')
                .attr('class', 'links')
                .selectAll('line')
                .data(this.graphData.links)
                .enter()
                .append('line')
                .attr('stroke', '#4b5563')
                .attr('stroke-width', d => d.strength * 2)
                .attr('stroke-opacity', 0.6);
            
            // 绘制节点
            const node = g.append('g')
                .attr('class', 'nodes')
                .selectAll('circle')
                .data(this.graphData.nodes)
                .enter()
                .append('circle')
                .attr('r', d => sizeMap[d.memory_tier] || 8)
                .attr('fill', d => colorMap[d.category] || '#6b7280')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .style('cursor', 'pointer')
                .call(d3.drag()
                    .on('start', (event, d) => {
                        if (!event.active) this.simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (event, d) => {
                        d.fx = event.x;
                        d.fy = event.y;
                    })
                    .on('end', (event, d) => {
                        if (!event.active) this.simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    }));
            
            // 节点标签
            const labels = g.append('g')
                .attr('class', 'labels')
                .selectAll('text')
                .data(this.graphData.nodes)
                .enter()
                .append('text')
                .text(d => d.label.length > 15 ? d.label.substring(0, 15) + '...' : d.label)
                .attr('font-size', '10px')
                .attr('fill', '#e5e7eb')
                .attr('text-anchor', 'middle')
                .attr('dy', d => (sizeMap[d.memory_tier] || 8) + 12)
                .style('pointer-events', 'none');
            
            // 点击事件
            node.on('click', (event, d) => {
                event.stopPropagation();
                this.selectedNode = d;
            });
            
            // 双击查看详情
            node.on('dblclick', (event, d) => {
                event.stopPropagation();
                this.viewMemoryDetail(d);
            });
            
            // 背景点击取消选择
            this.svg.on('click', () => {
                this.selectedNode = null;
            });
            
            // 更新位置
            this.simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);
                
                labels
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
        },

        resetZoom() {
            if (this.svg) {
                this.svg.transition()
                    .duration(750)
                    .call(d3.zoom().transform, d3.zoomIdentity);
            }
        },

        togglePhysics() {
            this.physicsEnabled = !this.physicsEnabled;
            if (this.simulation) {
                if (this.physicsEnabled) {
                    this.simulation.restart();
                } else {
                    this.simulation.stop();
                }
            }
        },

        async viewMemoryDetail(node) {
            if (!node) return;
            
            try {
                const response = await fetch(`/api/memory/memories/${node.id}`);
                if (response.ok) {
                    this.detailMemory = await response.json();
                    this.showDetailModal = true;
                }
            } catch (error) {
                console.error('Failed to load memory:', error);
            }
        },

        getCategoryClass(category) {
            const classes = {
                'architecture': 'bg-blue-600/20 text-blue-400',
                'decision': 'bg-green-600/20 text-green-400',
                'pattern': 'bg-purple-600/20 text-purple-400',
                'issue': 'bg-yellow-600/20 text-yellow-400',
                'bug': 'bg-red-600/20 text-red-400',
                'other': 'bg-gray-600/20 text-gray-400'
            };
            return classes[category] || classes['other'];
        },

        getTierText(tier) {
            const texts = {
                'episodic': '情景',
                'semantic': '语义',
                'procedural': '程序'
            };
            return texts[tier] || tier;
        }
    };
}</script>
