<div x-data="qualityPage()" x-init="init()">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-bold text-white">质量检查</h1>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-4 gap-3 mb-4">
        <div class="bg-gray-800/60 rounded-xl border border-gray-700/50 p-3">
            <div class="text-xs text-gray-500">总检查次数</div>
            <div class="text-xl font-bold text-white" x-text="stats.total || 0">0</div>
        </div>
        <div class="bg-gray-800/60 rounded-xl border border-gray-700/50 p-3">
            <div class="text-xs text-gray-500">发现问题</div>
            <div class="text-xl font-bold text-red-400" x-text="stats.with_issues || 0">0</div>
        </div>
        <div class="bg-gray-800/60 rounded-xl border border-gray-700/50 p-3">
            <div class="text-xs text-gray-500">总问题数</div>
            <div class="text-xl font-bold text-yellow-400" x-text="stats.total_issues || 0">0</div>
        </div>
        <div class="bg-gray-800/60 rounded-xl border border-gray-700/50 p-3">
            <div class="text-xs text-gray-500">今日检查</div>
            <div class="text-xl font-bold text-indigo-400" x-text="stats.today || 0">0</div>
        </div>
    </div>

    <!-- Trend Bar -->
    <div class="flex items-center gap-1 mb-4" x-show="trend.length > 0">
        <span class="text-xs text-gray-500 mr-2">近7天趋势：</span>
        <template x-for="d in trend" :key="d.date">
            <div class="group relative">
                <div class="w-6 rounded-sm" :class="d.count>0?'bg-indigo-600':'bg-gray-700'" :style="'height:'+Math.max(d.count*4,3)+'px'" :title="d.date+': '+d.count+'次'"></div>
                <div class="hidden group-hover:block absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-gray-900 px-2 py-1 rounded text-xs whitespace-nowrap"><span x-text="d.date"></span>: <span x-text="d.count"></span>次</div>
            </div>
        </template>
    </div>

    <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <label class="text-sm font-medium text-gray-300">文件名:</label>
                <input type="text" x-model="filename" class="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-white w-48" placeholder="可选">
            </div>
            <div class="flex gap-2">
                <button @click="loadHistory()" class="text-sm text-indigo-400 hover:underline">历史记录</button>
                <button @click="showHistory=true; loadHistory()" class="text-sm text-gray-400 hover:underline">更多 →</button>
            </div>
            <button @click="runCheck()" :disabled="checking"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                <span x-show="!checking">检查代码</span>
                <span x-show="checking">检查中...</span>
            </button>
        </div>
        <textarea x-model="code" rows="12"
                  class="w-full border border-gray-600 rounded p-3 text-sm font-mono bg-gray-900 text-blue-300 focus:outline-none"
                  placeholder="粘贴代码进行检查..."></textarea>
    </div>

    <!-- Results -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-4" x-show="result">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold text-white">检查结果</h2>
            <span :class="(result?.issueCount||0)===0?'text-green-400':'text-red-400'" class="text-sm font-medium" x-text="'发现 '+(result?.issueCount||0)+' 个问题'"></span>
        </div>
        <div x-show="(result?.issues||[]).length===0" class="text-green-400 text-sm py-4 text-center">✅ 未发现问题</div>
        <template x-for="(issue,idx) in (result?.issues||[])" :key="idx">
            <div class="flex items-start gap-3 py-2 border-b border-gray-700 last:border-0">
                <span class="text-xs px-1.5 py-0.5 rounded mt-0.5"
                      :class="issue.severity==='critical'?'bg-red-900/50 text-red-300':issue.severity==='high'?'bg-orange-900/50 text-orange-300':issue.severity==='medium'?'bg-yellow-900/50 text-yellow-300':'bg-gray-700 text-gray-300'"
                      x-text="issue.severity"></span>
                <div class="flex-1 min-w-0">
                    <p class="text-sm text-gray-200" x-text="issue.message"></p>
                    <p class="text-xs text-gray-500">第 <span x-text="issue.line"></span> 行 · <span x-text="issue.rule"></span></p>
                </div>
            </div>
        </template>
    </div>

    <!-- History Modal -->
    <div x-show="showHistory" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50" x-cloak>
        <div class="bg-gray-800 rounded-lg border border-gray-700 w-full max-w-3xl mx-4 max-h-[80vh] overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
                <h2 class="text-lg font-semibold text-white">检查历史</h2>
                <button @click="showHistory=false" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <table class="w-full text-sm">
                    <thead class="text-left text-gray-400"><tr><th class="px-3 py-2">文件名</th><th class="px-3 py-2">类型</th><th class="px-3 py-2">问题数</th><th class="px-3 py-2">时间</th></tr></thead>
                    <tbody class="text-gray-300">
                        <template x-for="item in history" :key="item.id">
                            <tr class="border-t border-gray-700 hover:bg-gray-700/50 cursor-pointer" @click="viewDetail(item)">
                                <td class="px-3 py-2" x-text="item.filename||'-'"></td>
                                <td class="px-3 py-2"><span class="px-2 py-0.5 rounded text-xs bg-indigo-900/50 text-indigo-300" x-text="item.checkType"></span></td>
                                <td class="px-3 py-2" :class="item.issueCount>0?'text-red-400':'text-green-400'" x-text="item.issueCount"></td>
                                <td class="px-3 py-2 text-gray-500" x-text="formatDate(item.createdAt)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
<script>window.qualityPage=function(){
  return{
    code:'', filename:'', checking:false, result:{}, showHistory:false, history:[],
    stats:{total:0,with_issues:0,total_issues:0,today:0}, trend:[],
    async init(){
      await this.loadStats()
      await this.loadHistory()
    },
    async loadStats(){
      try{
        var r=await fetch('/api/quality/history?limit=500');
        if(!r.ok) return;
        var items=await r.json();
        if(!Array.isArray(items)) items=items.items||[];
        var today=new Date().toISOString().substring(0,10);
        this.stats.total=items.length;
        this.stats.with_issues=items.filter(function(i){return i.issueCount>0}).length;
        this.stats.total_issues=items.reduce(function(s,i){return s+(i.issueCount||0)},0);
        this.stats.today=items.filter(function(i){return i.createdAt&&i.createdAt.substring(0,10)===today}).length;

        var trendData={};
        for(var d=6;d>=0;d--){
          var date=new Date();date.setDate(date.getDate()-d);
          trendData[date.toISOString().substring(0,10)]=0;
        }
        items.forEach(function(i){
          if(i.createdAt){var k=i.createdAt.substring(0,10);if(trendData[k]!==undefined)trendData[k]++}
        });
        this.trend=Object.entries(trendData).map(function(e){return{date:e[0].substring(5),count:e[1]}});
      }catch(e){}
    },
    async runCheck(){
      if(!this.code.trim())return;
      this.checking=true;this.result=null;
      try{
        var r=await fetch('/api/quality/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:this.code,filename:this.filename||null})});
        if(r.ok){this.result=await r.json();await this.loadStats();await this.loadHistory()}
      }catch(e){alert('检查失败: '+e.message)}
      finally{this.checking=false}
    },
    async loadHistory(){
      try{
        var r=await fetch('/api/quality/history?limit=50');
        var items=await r.json();
        this.history=Array.isArray(items)?items:(items.items||items||[]);
      }catch(e){}
    },
    async viewDetail(item){
      try{
        var r=await fetch('/api/quality/history/'+item.id);
        if(r.ok){
          var detail=await r.json();
          this.code='';
          this.filename=detail.filename||'';
          this.result={issues:detail.issues||[], issueCount:detail.issueCount||0};
          this.showHistory=false;
        }
      }catch(e){}
    },
    formatDate(d){return d?new Date(d).toLocaleString('zh-CN'):''}
  }
};</script>
