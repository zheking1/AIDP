{% extends "base.html" %}
{% block title %}文档管理{% endblock %}
{% block content %}
<div x-data="docList()" x-init="init()">
    <!-- Filters -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
        <div class="flex flex-wrap gap-3 items-end">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Workspace</label>
                <input x-model="filters.workspace_id" type="text" placeholder="all"
                       class="border rounded px-2 py-1 text-sm w-32">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">类型</label>
                <select x-model="filters.doc_type" class="border rounded px-2 py-1 text-sm">
                    <option value="">全部</option>
                    <option value="markdown">Markdown</option>
                    <option value="plain">Plain Text</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">状态</label>
                <select x-model="filters.index_status" class="border rounded px-2 py-1 text-sm">
                    <option value="">全部</option>
                    <option value="indexed">已索引</option>
                    <option value="pending">待索引</option>
                    <option value="error">错误</option>
                </select>
            </div>
            <button @click="load()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">查询</button>
            <a href="/documents/new" class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600">+ 新建</a>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="text-left text-gray-500 bg-gray-50">
                <tr>
                    <th class="px-4 py-2">标题</th>
                    <th class="px-4 py-2">类型</th>
                    <th class="px-4 py-2">状态</th>
                    <th class="px-4 py-2">创建时间</th>
                    <th class="px-4 py-2">操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="doc in items" :key="doc.id">
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2">
                            <a :href="'/documents/' + doc.id" class="text-blue-600 hover:underline" x-text="doc.title"></a>
                        </td>
                        <td class="px-4 py-2" x-text="doc.doc_type"></td>
                        <td class="px-4 py-2">
                            <span class="px-2 py-0.5 rounded text-xs"
                                  :class="{
                                      'bg-green-100 text-green-700': doc.index_status === 'indexed',
                                      'bg-yellow-100 text-yellow-700': doc.index_status === 'pending',
                                      'bg-red-100 text-red-700': doc.index_status === 'error'
                                  }" x-text="doc.index_status"></span>
                        </td>
                        <td class="px-4 py-2 text-gray-500" x-text="new Date(doc.created_at).toLocaleString()"></td>
                        <td class="px-4 py-2">
                            <a :href="'/documents/' + doc.id" class="text-blue-600 hover:underline mr-2">查看</a>
                            <button @click="deleteDoc(doc.id)" class="text-red-600 hover:underline">删除</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="items.length === 0">
                    <td colspan="5" class="px-4 py-8 text-center text-gray-400">暂无文档</td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="px-4 py-2 border-t flex justify-between items-center text-sm text-gray-500">
            <span>共 <span x-text="total"></span> 条</span>
            <div class="space-x-2">
                <button @click="page > 1 && (page--, load())" :disabled="page <= 1"
                        class="px-2 py-1 border rounded disabled:opacity-50">上一页</button>
                <span x-text="page + ' / ' + totalPages"></span>
                <button @click="page < totalPages && (page++, load())" :disabled="page >= totalPages"
                        class="px-2 py-1 border rounded disabled:opacity-50">下一页</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function docList() {
    return {
        items: [], total: 0, page: 1, pageSize: 20,
        filters: { workspace_id: '', doc_type: '', index_status: '' },
        get totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
        async init() { await this.load(); },
        async load() {
            const p = new URLSearchParams({ page: this.page, page_size: this.pageSize });
            if (this.filters.workspace_id) p.set('workspace_id', this.filters.workspace_id);
            if (this.filters.doc_type) p.set('doc_type', this.filters.doc_type);
            const resp = await fetch('/api/documents?' + p);
            const data = await resp.json();
            this.items = data.items || [];
            this.total = data.total || 0;
            if (this.filters.index_status) {
                this.items = this.items.filter(d => d.index_status === this.filters.index_status);
            }
        },
        async deleteDoc(id) {
            if (!confirm('确认删除?')) return;
            await fetch('/api/documents/' + id, { method: 'DELETE' });
            await this.load();
        }
    };
}
</script>
{% endblock %}
