services:
  knowledge-tool:
    build: .
    network_mode: host
    environment:
      - DATABASE_URL=postgresql+asyncpg://novel_os:jygame_postgres_01@127.0.0.1:5432/novel_os
      - STORAGE_LOCAL_ROOT=/app/data/knowledge
    volumes:
      - ./data/knowledge:/app/data/knowledge
    restart: unless-stopped
