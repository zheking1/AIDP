{% extends "base.html" %}
{% block title %}Asset Tool - 仪表盘{% endblock %}
{% block content %}
<div x-data="dashboard()" x-init="init()">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="text-sm text-gray-500">资产总数</div>
            <div class="text-2xl font-bold text-gray-800" x-text="stats.total">-</div>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="text-sm text-gray-500">代码片段</div>
            <div class="text-2xl font-bold text-blue-600" x-text="stats.snippet">-</div>
        </div>
        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="text-sm text-gray-500">配置模板</div>
            <div class="text-2xl font-bold text-green-600" x-text="stats.config">-</div>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
        <h2 class="text-lg font-semibold mb-3">快捷操作</h2>
        <div class="flex space-x-3">
            <a href="/assets/new" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm">创建资产</a>
            <a href="/assets" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm">管理资产</a>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-4">
        <h2 class="text-lg font-semibold mb-3">最近资产</h2>
        <table class="w-full text-sm">
            <thead class="text-left text-gray-500 border-b">
                <tr><th class="pb-2">标题</th><th class="pb-2">类型</th><th class="pb-2">语言</th><th class="pb-2">创建时间</th></tr>
            </thead>
            <tbody>
                <template x-for="item in recent" :key="item.id">
                    <tr class="border-b hover:bg-gray-50">
                        <td class="py-2"><a :href="'/assets/' + item.id" class="text-blue-600 hover:underline" x-text="item.title"></a></td>
                        <td class="py-2" x-text="item.asset_type"></td>
                        <td class="py-2" x-text="item.language || '-'"></td>
                        <td class="py-2 text-gray-500" x-text="new Date(item.created_at).toLocaleString()"></td>
                    </tr>
                </template>
                <tr x-show="recent.length === 0"><td colspan="4" class="py-4 text-center text-gray-400">暂无资产</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function dashboard() {
    return {
        stats: { total: 0, snippet: 0, config: 0 },
        recent: [],
        async init() {
            const resp = await fetch('/api/assets?page_size=5');
            const data = await resp.json();
            this.recent = data.items || [];
            this.stats.total = data.total || 0;
            this.stats.snippet = this.recent.filter(i => i.asset_type === 'snippet').length;
            this.stats.config = this.recent.filter(i => i.asset_type === 'config').length;
        }
    };
}
</script>
{% endblock %}
