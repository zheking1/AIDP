{% extends "base.html" %}
{% block title %}{{ "编辑资产" if mode == "edit" else "创建资产" }}{% endblock %}
{% block content %}
<div x-data="assetForm()" x-init="init()">
    <div class="flex items-center space-x-3 mb-4">
        <a href="/assets" class="text-gray-500 hover:text-blue-600">← 返回</a>
        <h1 class="text-xl font-bold" x-text="mode === 'edit' ? '编辑资产' : '创建资产'"></h1>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-6 max-w-2xl">
        <form @submit.prevent="submit()">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标题 <span class="text-red-500">*</span></label>
                    <input x-model="form.title" type="text" required class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">类型</label>
                        <select x-model="form.asset_type" class="w-full border rounded px-3 py-2 text-sm">
                            <option value="snippet">代码片段</option>
                            <option value="config">配置</option>
                            <option value="pattern">模式</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">语言</label>
                        <select x-model="form.language" class="w-full border rounded px-3 py-2 text-sm">
                            <option value="">-</option>
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="bash">Bash</option>
                            <option value="json">JSON</option>
                            <option value="yaml">YAML</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">内容 <span class="text-red-500">*</span></label>
                    <textarea x-model="form.content" required rows="15" class="w-full border rounded px-3 py-2 text-sm font-mono"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                    <textarea x-model="form.description" rows="3" class="w-full border rounded px-3 py-2 text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标签 (逗号分隔)</label>
                    <input x-model="form.tags" type="text" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" :disabled="loading" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">保存</button>
                    <a href="/assets" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded text-sm">取消</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function assetForm() {
    return {
        mode: '{{ mode }}',
        assetId: '{{ asset_id | default("") }}',
        loading: false,
        form: { title: '', asset_type: 'snippet', language: '', content: '', description: '', tags: '' },
        async init() {
            if (this.mode === 'edit' && this.assetId) {
                const resp = await fetch('/api/assets/' + this.assetId);
                const data = await resp.json();
                this.form = { ...data, tags: (data.tags || []).join(', ') };
            }
        },
        async submit() {
            this.loading = true;
            try {
                const body = { ...this.form, tags: this.form.tags ? this.form.tags.split(',').map(t => t.trim()) : [] };
                const url = this.mode === 'edit' ? '/api/assets/' + this.assetId : '/api/assets';
                const method = this.mode === 'edit' ? 'PUT' : 'POST';
                const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (resp.ok) { window.location.href = '/assets'; } else { alert('保存失败'); }
            } finally { this.loading = false; }
        }
    };
}
</script>
{% endblock %}
