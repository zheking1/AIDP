{% extends "base.html" %}
{% block title %}向量搜索 - Memory Tool{% endblock %}

{% block content %}
<div x-data="vectorSearch()" x-init="init()" class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
            <svg class="w-7 h-7 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            向量搜索
        </h1>
        <div class="text-sm text-gray-500">
            基于语义相似度的智能搜索
        </div>
    </div>

    <!-- Search Panel -->
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex gap-4 mb-4">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-2">搜索查询</label>
                <div class="relative">
                    <input 
                        x-model="query" 
                        @keydown.enter="search()"
                        type="text" 
                        class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 pl-11 text-lg focus:outline-none focus:border-purple-500 transition-colors"
                        placeholder="输入搜索内容，支持自然语言..."
                    >
                    <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
            <div class="w-32">
                <label class="block text-sm font-medium text-gray-700 mb-2">Top K</label>
                <select x-model="topK" class="w-full border rounded-lg px-3 py-3 text-lg">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-3 mb-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">分类</label>
                <select x-model="filters.category" class="border rounded px-3 py-1.5 text-sm">
                    <option value="">全部</option>
                    <option value="architecture">架构</option>
                    <option value="decision">决策</option>
                    <option value="pattern">模式</option>
                    <option value="issue">问题</option>
                    <option value="bug">Bug</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">层级</label>
                <select x-model="filters.memory_tier" class="border rounded px-3 py-1.5 text-sm">
                    <option value="">全部</option>
                    <option value="episodic">情景</option>
                    <option value="semantic">语义</option>
                    <option value="procedural">程序</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">项目</label>
                <select x-model="filters.project" class="border rounded px-3 py-1.5 text-sm min-w-[120px]">
                    <option value="">全部项目</option>
                    <template x-for="proj in projects" :key="proj">
                        <option :value="proj" x-text="proj"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">最小相似度</label>
                <input x-model="filters.min_score" type="number" step="0.05" min="0" max="1"
                       class="border rounded px-3 py-1.5 text-sm w-24" placeholder="0.0">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <label class="flex items-center gap-1 text-sm text-gray-600">
                    <input type="checkbox" x-model="includeEmbedding" class="rounded">
                    显示向量信息
                </label>
                <label class="flex items-center gap-1 text-sm text-gray-600">
                    <input type="checkbox" x-model="showGraph" class="rounded">
                    图谱视图
                </label>
            </div>
            <button 
                @click="search()"
                :disabled="loading || !query.trim()"
                class="px-6 py-2 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-300 text-white rounded-lg font-medium flex items-center gap-2"
            >
                <svg x-show="!loading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <svg x-show="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span x-text="loading ? '搜索中...' : '搜索'"></span>
            </button>
        </div>
    </div>

    <!-- Results Stats -->
    <div x-show="searched && !loading" class="bg-purple-50 rounded-lg p-3 flex items-center justify-between">
        <div class="flex items-center gap-4 text-sm">
            <span>找到 <strong class="text-purple-700" x-text="results.length"></strong> 个结果</span>
            <span x-show="searchTime > 0" class="text-gray-500">耗时 <span x-text="searchTime"></span>ms</span>
            <span x-show="embeddingTime > 0" class="text-gray-500">向量化: <span x-text="embeddingTime"></span>ms</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-xs text-gray-500">排序:</span>
            <select x-model="sortBy" @change="sortResults()" class="text-sm border rounded px-2 py-1 bg-white">
                <option value="score">相似度</option>
                <option value="date">日期</option>
                <option value="access">访问次数</option>
            </select>
        </div>
    </div>

    <!-- Graph Visualization -->
    <div x-show="showGraph && results.length > 0" class="bg-white rounded-lg shadow p-4">
        <h3 class="font-medium text-gray-700 mb-3">搜索结果图谱</h3>
        <div id="search-graph" class="h-[400px] border rounded-lg"></div>
    </div>

    <!-- Results List -->
    <div x-show="results.length > 0" class="space-y-3">
        <template x-for="(result, index) in results" :key="result.id">
            <div class="bg-white rounded-lg shadow p-4 hover:shadow-md transition-shadow">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-purple-600" x-text="`#${index + 1}`"></span>
                            <span class="px-2 py-0.5 rounded text-xs font-medium"
                                  :class="getCategoryClass(result.category)"
                                  x-text="getCategoryLabel(result.category)"></span>
                            <span class="px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600"
                                  x-text="getTierLabel(result.memory_tier)"></span>
                            <span x-show="result.ai_suggested" class="px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-600">AI</span>
                        </div>
                        <a :href="'/memories/' + result.id" class="text-lg font-medium text-blue-600 hover:underline" x-text="result.title"></a>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold" :class="scoreColor(result.score)" x-text="(result.score * 100).toFixed(1) + '%'"></div>
                        <div class="text-xs text-gray-400">相似度</div>
                    </div>
                </div>

                <!-- Content Preview -->
                <p class="text-sm text-gray-600 mb-3 line-clamp-3" x-html="highlightText(result.content, query)"></p>

                <!-- Meta Info -->
                <div class="flex items-center justify-between text-xs text-gray-500">
                    <div class="flex items-center gap-4">
                        <span x-show="result.project" class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <span x-text="result.project"></span>
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            <span x-text="(result.access_count || 0) + ' 次访问'"></span>
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span x-text="formatDate(result.created_at)"></span>
                        </span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="viewMemory(result.id)" class="text-blue-600 hover:underline">查看</button>
                        <button @click="addToContext(result)" class="text-purple-600 hover:underline">添加到上下文</button>
                    </div>
                </div>

                <!-- Embedding Info (Optional) -->
                <div x-show="includeEmbedding && result.embedding_info" class="mt-3 pt-3 border-t">
                    <div class="text-xs text-gray-400 flex items-center gap-2">
                        <span>模型: <span x-text="result.embedding_info?.model || '-'"></span></span>
                        <span>维度: <span x-text="result.embedding_info?.dimension || '-'"></span></span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="searched && results.length === 0 && !loading" class="text-center py-12">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <p class="text-gray-500 text-lg">未找到匹配结果</p>
        <p class="text-gray-400 text-sm mt-1">尝试调整搜索关键词或降低相似度阈值</p>
    </div>

    <!-- Context Builder -->
    <div x-show="contextMemories.length > 0" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-xl border p-4 w-80">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                上下文包 (<span x-text="contextMemories.length"></span>)
            </h3>
            <button @click="contextMemories = []" class="text-gray-400 hover:text-red-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="space-y-2 max-h-48 overflow-auto mb-3">
            <template x-for="(mem, idx) in contextMemories" :key="mem.id">
                <div class="flex items-center justify-between text-sm p-2 bg-gray-50 rounded">
                    <span class="truncate flex-1" x-text="mem.title"></span>
                    <button @click="removeFromContext(idx)" class="text-red-500 hover:text-red-700 ml-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </template>
        </div>
        <div class="flex gap-2">
            <button @click="generateContextPackage()" class="flex-1 px-3 py-2 bg-purple-600 text-white rounded text-sm hover:bg-purple-700">
                生成上下文包
            </button>
            <button @click="copyContextPackage()" class="px-3 py-2 bg-gray-100 text-gray-700 rounded text-sm hover:bg-gray-200">
                复制
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function vectorSearch() {
    return {
        query: '',
        topK: 10,
        loading: false,
        searched: false,
        results: [],
        searchTime: 0,
        embeddingTime: 0,
        projects: [],
        includeEmbedding: false,
        showGraph: false,
        sortBy: 'score',
        contextMemories: [],
        filters: {
            category: '',
            memory_tier: '',
            project: '',
            min_score: 0.0
        },

        async init() {
            await this.loadProjects();
        },

        async loadProjects() {
            try {
                const resp = await fetch('/api/memories/projects');
                if (resp.ok) {
                    const data = await resp.json();
                    this.projects = data.data || [];
                }
            } catch (e) {
                console.error('Failed to load projects:', e);
            }
        },

        async search() {
            if (!this.query.trim()) return;
            
            this.loading = true;
            this.searched = true;
            const startTime = Date.now();

            try {
                const body = {
                    query: this.query,
                    top_k: parseInt(this.topK),
                    min_score: parseFloat(this.filters.min_score) || 0.0,
                    filters: {}
                };

                if (this.filters.category) body.filters.category = this.filters.category;
                if (this.filters.memory_tier) body.filters.memory_tier = this.filters.memory_tier;
                if (this.filters.project) body.filters.project = this.filters.project;

                const resp = await fetch('/api/memories/search/semantic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();
                this.results = data.data?.results || data.results || [];
                this.searchTime = Date.now() - startTime;
                this.embeddingTime = data.data?.embedding_time_ms || 0;

                this.sortResults();

                if (this.showGraph) {
                    this.$nextTick(() => this.renderGraph());
                }
            } catch (e) {
                console.error('Search failed:', e);
                alert('搜索失败: ' + e.message);
            } finally {
                this.loading = false;
            }
        },

        sortResults() {
            if (this.sortBy === 'score') {
                this.results.sort((a, b) => (b.score || 0) - (a.score || 0));
            } else if (this.sortBy === 'date') {
                this.results.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            } else if (this.sortBy === 'access') {
                this.results.sort((a, b) => (b.access_count || 0) - (a.access_count || 0));
            }
        },

        scoreColor(score) {
            if (score >= 0.8) return 'text-green-600';
            if (score >= 0.6) return 'text-blue-600';
            if (score >= 0.4) return 'text-yellow-600';
            return 'text-gray-600';
        },

        highlightText(text, query) {
            if (!text || !query) return text;
            const terms = query.trim().split(/\s+/);
            let highlighted = text;
            terms.forEach(term => {
                const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                highlighted = highlighted.replace(regex, '<mark class="bg-purple-100 px-0.5 rounded">$1</mark>');
            });
            return highlighted;
        },

        viewMemory(id) {
            window.location.href = '/memories/' + id;
        },

        addToContext(memory) {
            if (!this.contextMemories.find(m => m.id === memory.id)) {
                this.contextMemories.push(memory);
            }
        },

        removeFromContext(index) {
            this.contextMemories.splice(index, 1);
        },

        async generateContextPackage() {
            try {
                const resp = await fetch('/api/context/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memory_ids: this.contextMemories.map(m => m.id),
                        query: this.query
                    })
                });

                const data = await resp.json();
                if (data.success !== false) {
                    alert('上下文包已生成');
                }
            } catch (e) {
                alert('生成失败: ' + e.message);
            }
        },

        async copyContextPackage() {
            const text = this.contextMemories.map(m => `## ${m.title}\n${m.content}`).join('\n\n');
            await navigator.clipboard.writeText(text);
            alert('已复制到剪贴板');
        },

        getCategoryClass(category) {
            const map = {
                'architecture': 'bg-blue-100 text-blue-700',
                'decision': 'bg-green-100 text-green-700',
                'pattern': 'bg-amber-100 text-amber-700',
                'issue': 'bg-red-100 text-red-700',
                'bug': 'bg-red-100 text-red-800',
            };
            return map[category] || 'bg-gray-100 text-gray-700';
        },

        getCategoryLabel(category) {
            const map = {
                'architecture': '架构',
                'decision': '决策',
                'pattern': '模式',
                'issue': '问题',
                'bug': 'Bug',
            };
            return map[category] || category;
        },

        getTierLabel(tier) {
            const map = {
                'episodic': '情景',
                'semantic': '语义',
                'procedural': '程序',
            };
            return map[tier] || tier;
        },

        formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('zh-CN');
        },

        renderGraph() {
            // Simple graph visualization of search results
            const container = document.getElementById('search-graph');
            if (!container) return;

            container.innerHTML = '';
            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select('#search-graph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Create nodes from results
            const nodes = this.results.map((r, i) => ({
                id: r.id,
                title: r.title,
                score: r.score,
                category: r.category,
                index: i
            }));

            // Create links between similar results
            const links = [];
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    if (Math.abs(nodes[i].score - nodes[j].score) < 0.1) {
                        links.push({ source: nodes[i].id, target: nodes[j].id });
                    }
                }
            }

            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(50))
                .force('charge', d3.forceManyBody().strength(-100))
                .force('center', d3.forceCenter(width / 2, height / 2));

            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('stroke', '#cbd5e1')
                .attr('stroke-width', 1);

            const node = svg.append('g')
                .selectAll('circle')
                .data(nodes)
                .join('circle')
                .attr('r', d => 5 + d.score * 10)
                .attr('fill', d => {
                    const colors = {
                        'architecture': '#3b82f6',
                        'decision': '#10b981',
                        'pattern': '#f59e0b',
                        'issue': '#ef4444',
                        'bug': '#dc2626'
                    };
                    return colors[d.category] || '#6b7280';
                })
                .call(d3.drag()
                    .on('start', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (event, d) => {
                        d.fx = event.x;
                        d.fy = event.y;
                    })
                    .on('end', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    }));

            const label = svg.append('g')
                .selectAll('text')
                .data(nodes)
                .join('text')
                .text(d => d.title.substring(0, 10))
                .attr('font-size', '10px')
                .attr('fill', '#374151')
                .attr('dx', 8)
                .attr('dy', 3);

            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
        }
    };
}
</script>
{% endblock %}
