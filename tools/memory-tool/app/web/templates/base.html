<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Memory Tool{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/static/js/utils.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/" class="text-xl font-bold text-blue-600">🧠 Memory Tool</a>
                <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">v0.2.0</span>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <a href="/" class="text-gray-600 hover:text-blue-600">仪表盘</a>
                <a href="/memories" class="text-gray-600 hover:text-blue-600">记忆</a>
                <a href="/search" class="text-purple-600 hover:text-purple-800 font-medium">🔍 搜索</a>
                <a href="/memories/graph" class="text-purple-600 hover:text-purple-800 font-medium">🕸️ 图谱</a>
                <a href="/context" class="text-gray-600 hover:text-blue-600">上下文</a>
                <a href="/review" class="text-orange-600 hover:text-orange-800 font-medium">🔍 审核</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
