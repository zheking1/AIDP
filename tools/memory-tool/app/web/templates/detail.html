{% extends "base.html" %}
{% block title %}记忆详情{% endblock %}
{% block content %}
<div x-data="memoryDetail()" x-init="init()">
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">
            <a href="/memories" class="text-gray-500 hover:text-blue-600">← 返回</a>
            <h1 class="text-xl font-bold" x-text="item.title || '加载中...'"></h1>
        </div>
        <div class="space-x-2">
            <a :href="'/memories/' + memoryId + '/edit'" class="bg-blue-500 text-white px-3 py-1 rounded text-sm">编辑</a>
            <button @click="deleteItem()" class="bg-red-500 text-white px-3 py-1 rounded text-sm">删除</button>
        </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div class="bg-white rounded-lg shadow-sm p-4">
            <h2 class="font-semibold mb-2">信息</h2>
            <dl class="text-sm space-y-1">
                <div class="flex"><dt class="w-24 text-gray-500">项目:</dt><dd x-text="item.project_id"></dd></div>
                <div class="flex"><dt class="w-24 text-gray-500">类型:</dt><dd x-text="item.memory_type"></dd></div>
                <div class="flex"><dt class="w-24 text-gray-500">重要性:</dt><dd class="text-yellow-500" x-text="'★'.repeat(item.importance || 0)"></dd></div>
                <div class="flex"><dt class="w-24 text-gray-500">标签:</dt><dd x-text="(item.tags || []).join(', ')"></dd></div>
                <div class="flex"><dt class="w-24 text-gray-500">创建:</dt><dd x-text="new Date(item.created_at).toLocaleString()"></dd></div>
            </dl>
        </div>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-4">
        <h2 class="font-semibold mb-2">内容</h2>
        <pre class="bg-gray-50 p-4 rounded text-sm whitespace-pre-wrap" x-text="item.content"></pre>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function memoryDetail() {
    return {
        memoryId: window.location.pathname.split('/').pop(),
        item: {},
        async init() {
            const resp = await fetch('/api/memory/' + this.memoryId);
            this.item = await resp.json();
        },
        async deleteItem() {
            if (!confirm('确认删除?')) return;
            await fetch('/api/memory/' + this.memoryId, { method: 'DELETE' });
            window.location.href = '/memories';
        }
    };
}
</script>
{% endblock %}
