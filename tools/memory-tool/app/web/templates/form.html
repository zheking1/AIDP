{% extends "base.html" %}
{% block title %}{{ "编辑记忆" if mode == "edit" else "创建记忆" }}{% endblock %}
{% block content %}
<div x-data="memoryForm()" x-init="init()">
    <div class="flex items-center space-x-3 mb-4">
        <a href="/memories" class="text-gray-500 hover:text-blue-600">← 返回</a>
        <h1 class="text-xl font-bold" x-text="mode === 'edit' ? '编辑记忆' : '创建记忆'"></h1>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-6 max-w-2xl">
        <form @submit.prevent="submit()">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Project ID <span class="text-red-500">*</span></label>
                    <input x-model="form.project_id" type="text" required class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标题 <span class="text-red-500">*</span></label>
                    <input x-model="form.title" type="text" required class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">内容 <span class="text-red-500">*</span></label>
                    <textarea x-model="form.content" required rows="8" class="w-full border rounded px-3 py-2 text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">类型</label>
                        <select x-model="form.memory_type" class="w-full border rounded px-3 py-2 text-sm">
                            <option value="decision">决策</option>
                            <option value="pattern">模式</option>
                            <option value="bug">Bug</option>
                            <option value="workflow">工作流</option>
                            <option value="fact">事实</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">重要性 (1-5)</label>
                        <input x-model="form.importance" type="range" min="1" max="5" class="w-full">
                        <div class="text-center text-sm text-gray-500" x-text="form.importance"></div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标签 (逗号分隔)</label>
                    <input x-model="form.tags" type="text" class="w-full border rounded px-3 py-2 text-sm">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" :disabled="loading" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">保存</button>
                    <a href="/memories" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded text-sm">取消</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function memoryForm() {
    return {
        mode: '{{ mode }}',
        memoryId: '{{ memory_id | default(0) }}',
        loading: false,
        form: { project_id: '', title: '', content: '', memory_type: 'decision', importance: 3, tags: '' },
        async init() {
            if (this.mode === 'edit' && this.memoryId) {
                const resp = await fetch('/api/memory/' + this.memoryId);
                const data = await resp.json();
                this.form = { ...data, tags: (data.tags || []).join(', ') };
            }
        },
        async submit() {
            this.loading = true;
            try {
                const body = { ...this.form, tags: this.form.tags ? this.form.tags.split(',').map(t => t.trim()) : [] };
                const url = this.mode === 'edit' ? '/api/memory/' + this.memoryId : '/api/memory';
                const method = this.mode === 'edit' ? 'PUT' : 'POST';
                const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (resp.ok) { window.location.href = '/memories'; } else { alert('保存失败'); }
            } finally { this.loading = false; }
        }
    };
}
</script>
{% endblock %}
