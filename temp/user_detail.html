{% extends "layouts/unified_base.html" %}
{% block title %}用户详情{% endblock %}

{% block content %}
<div x-data="userDetailPage()" x-init="init()">
    <!-- Header -->
    <div class="flex items-center gap-4 mb-6">
        <a href="/admin/users" class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-white">用户详情</h1>
            <p class="text-sm text-gray-400 mt-1" x-text="'查看用户 ' + (user?.username || '') + ' 的信息'"></p>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-2xl text-indigo-400"></i>
        <p class="text-gray-400 mt-2">加载中...</p>
    </div>

    <div x-show="!loading && user" class="space-y-6">
        <!-- User Info Card -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fas fa-user text-indigo-400"></i>
                    基本信息
                </h2>
                <div class="flex gap-2">
                    <a :href="'/admin/users/' + userId + '/edit'"
                       class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg transition">
                        <i class="fas fa-edit mr-1"></i>编辑
                    </a>
                </div>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">用户名</label>
                        <p class="text-white font-medium" x-text="user?.username"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">邮箱</label>
                        <p class="text-white" x-text="user?.email || '未设置'"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">昵称</label>
                        <p class="text-white" x-text="user?.nickname || '未设置'"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">角色</label>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                              :class="{
                                  'bg-red-500/20 text-red-400': user?.role === 'super_admin',
                                  'bg-indigo-500/20 text-indigo-400': user?.role === 'admin',
                                  'bg-blue-500/20 text-blue-400': user?.role === 'developer',
                                  'bg-gray-500/20 text-gray-400': user?.role === 'user',
                                  'bg-yellow-500/20 text-yellow-400': user?.role === 'readonly'
                              }"
                              x-text="roleLabels[user?.role] || user?.role">
                        </span>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">状态</label>
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium"
                              :class="{
                                  'bg-green-500/20 text-green-400': user?.status === 'active',
                                  'bg-gray-500/20 text-gray-400': user?.status === 'inactive',
                                  'bg-yellow-500/20 text-yellow-400': user?.status === 'suspended'
                              }">
                            <span class="w-1.5 h-1.5 rounded-full"
                                  :class="{
                                      'bg-green-400': user?.status === 'active',
                                      'bg-gray-400': user?.status === 'inactive',
                                      'bg-yellow-400': user?.status === 'suspended'
                                  }"></span>
                            <span x-text="statusLabels[user?.status] || user?.status"></span>
                        </span>
                    </div>
                    <div x-show="user?.remark">
                        <label class="block text-xs text-gray-400 mb-1">备注</label>
                        <p class="text-white" x-text="user?.remark"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">创建时间</label>
                        <p class="text-gray-300 text-sm" x-text="formatDate(user?.created_at)"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">最近登录</label>
                        <p class="text-gray-300 text-sm" x-text="user?.last_login_at ? formatDate(user?.last_login_at) : '从未登录'"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Login History -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fas fa-sign-in-alt text-green-400"></i>
                    登录历史
                </h2>
            </div>
            <div x-show="loginLogs.length === 0" class="p-8 text-center">
                <p class="text-gray-400">暂无登录记录</p>
            </div>
            <div x-show="loginLogs.length > 0" class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-900/50">
                        <tr>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-400 uppercase">时间</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-400 uppercase">操作</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-400 uppercase">IP 地址</th>
                            <th class="text-left px-6 py-3 text-xs font-semibold text-gray-400 uppercase">结果</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700">
                        <template x-for="log in loginLogs" :key="log.id">
                            <tr class="hover:bg-gray-700/50 transition">
                                <td class="px-6 py-4 text-sm text-gray-300" x-text="formatDate(log.created_at)"></td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          :class="{
                                              'bg-green-500/20 text-green-400': log.action === 'login',
                                              'bg-blue-500/20 text-blue-400': log.action === 'logout',
                                              'bg-red-500/20 text-red-400': log.action === 'login_failed'
                                          }"
                                          x-text="actionLabels[log.action] || log.action">
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-400 font-mono" x-text="log.ip_address || '-'"></td>
                                <td class="px-6 py-4">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          :class="log.success ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'"
                                          x-text="log.success ? '成功' : '失败'">
                                    </span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
function userDetailPage() {
    return {
        userId: '{{ target_user_id }}',
        loading: true,
        user: null,
        loginLogs: [],
        roleLabels: {
            'super_admin': '超级管理员',
            'admin': '管理员',
            'developer': '开发者',
            'user': '普通用户',
            'readonly': '只读用户'
        },
        statusLabels: {
            'active': '活跃',
            'inactive': '已禁用',
            'suspended': '已挂起',
            'pending': '待审核'
        },
        actionLabels: {
            'login': '登录',
            'logout': '登出',
            'login_failed': '登录失败'
        },

        async init() {
            await this.loadUser();
        },

        async loadUser() {
            this.loading = true;
            try {
                const resp = await fetch(`/api/auth/users/${this.userId}`);
                if (!resp.ok) throw new Error('Failed');
                const data = await resp.json();
                this.user = data.user;
                this.loginLogs = data.login_logs || [];
            } catch (e) {
                console.error('Load user error:', e);
            } finally {
                this.loading = false;
            }
        },

        formatDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
    };
}
</script>
{% endblock %}
