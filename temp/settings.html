{% extends "layouts/unified_base.html" %}
{% block title %}系统设置{% endblock %}

{% block content %}
<div x-data="settingsPage()" x-init="init()">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">系统设置</h1>
            <p class="text-sm text-gray-400 mt-1">管理平台配置和安全策略</p>
        </div>
        <button @click="saveAll()" 
                :disabled="saving"
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-lg text-sm font-medium transition">
            <i class="fas fa-save mr-2"></i>
            <span x-text="saving ? '保存中...' : '保存设置'"></span>
        </button>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-2xl text-indigo-400"></i>
        <p class="text-gray-400 mt-2">加载中...</p>
    </div>

    <!-- Settings Groups -->
    <div x-show="!loading" class="space-y-6">
        <!-- Site Settings -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fas fa-globe text-indigo-400"></i>
                    站点设置
                </h2>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">站点名称</label>
                    <input type="text" x-model="form['site.name']"
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">站点描述</label>
                    <input type="text" x-model="form['site.description']"
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>

        <!-- Auth Settings -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fas fa-shield-alt text-green-400"></i>
                    认证与安全
                </h2>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-white">允许注册</p>
                        <p class="text-xs text-gray-400">是否允许新用户自行注册账号</p>
                    </div>
                    <button @click="form['auth.allow_registration'] = form['auth.allow_registration'] === 'true' ? 'false' : 'true'"
                            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
                            :class="form['auth.allow_registration'] === 'true' ? 'bg-indigo-600' : 'bg-gray-600'">
                        <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                              :class="form['auth.allow_registration'] === 'true' ? 'translate-x-6' : 'translate-x-1'"></span>
                    </button>
                </div>
                <div class="border-t border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Session 超时时间（秒）</label>
                    <input type="number" x-model="form['auth.session_timeout']"
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">最大登录尝试次数</label>
                    <input type="number" x-model="form['auth.max_login_attempts']"
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">账户锁定时长（秒）</label>
                    <input type="number" x-model="form['auth.lockout_duration']"
                           class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
        </div>

        <!-- Save Status -->
        <div x-show="saveMsg" x-transition
             class="fixed bottom-6 right-6 px-4 py-2 rounded-lg text-sm font-medium shadow-lg"
             :class="saveOk ? 'bg-green-600 text-white' : 'bg-red-600 text-white'"
             x-text="saveMsg">
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
function settingsPage() {
    return {
        loading: true,
        saving: false,
        saveMsg: '',
        saveOk: false,
        form: {},

        async init() {
            await this.loadSettings();
        },

        async loadSettings() {
            this.loading = true;
            try {
                const resp = await fetch('/api/auth/settings');
                if (!resp.ok) throw new Error('Failed');
                const data = await resp.json();
                (data.items || []).forEach(s => {
                    this.form[s.key] = s.value;
                });
            } catch (e) {
                console.error('Load settings error:', e);
            } finally {
                this.loading = false;
            }
        },

        async saveAll() {
            this.saving = true;
            this.saveMsg = '';
            try {
                const resp = await fetch('/api/auth/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ settings: this.form })
                });
                const data = await resp.json();
                if (data.success) {
                    this.saveMsg = '保存成功';
                    this.saveOk = true;
                } else {
                    this.saveMsg = '保存失败';
                    this.saveOk = false;
                }
            } catch (e) {
                this.saveMsg = '保存失败: ' + e.message;
                this.saveOk = false;
            } finally {
                this.saving = false;
                setTimeout(() => { this.saveMsg = ''; }, 3000);
            }
        }
    };
}
</script>
{% endblock %}
