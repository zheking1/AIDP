{% extends "layouts/unified_base.html" %}
{% block title %}工具管理{% endblock %}

{% block content %}
<div x-data="toolsPage()" x-init="init()">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">工具管理</h1>
            <p class="text-sm text-gray-400 mt-1">查看和管理已注册的工具</p>
        </div>
        <button @click="checkAllHealth()" :disabled="checkingAll"
                class="px-4 py-2 bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white rounded-lg text-sm font-medium transition">
            <i class="fas fa-heartbeat mr-2"></i>
            <span x-text="checkingAll ? '检查中...' : '全部健康检查'"></span>
        </button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-plug text-blue-400"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-white" x-text="tools.length">0</p>
                    <p class="text-xs text-gray-400">总工具数</p>
                </div>
            </div>
        </div>
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-check-circle text-green-400"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-white" x-text="tools.filter(t => t.status === 'healthy').length">0</p>
                    <p class="text-xs text-gray-400">健康</p>
                </div>
            </div>
        </div>
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-exclamation-circle text-red-400"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-white" x-text="tools.filter(t => t.status !== 'healthy').length">0</p>
                    <p class="text-xs text-gray-400">异常</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-2xl text-indigo-400"></i>
    </div>

    <!-- Tools Grid -->
    <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="tool in tools" :key="tool.id">
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-5 hover:border-gray-600 transition">
                <div class="flex items-start justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center"
                             :class="tool.status === 'healthy' ? 'bg-green-500/20' : 'bg-red-500/20'">
                            <i class="fas" :class="tool.status === 'healthy' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-red-400'"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-white" x-text="tool.display_name || tool.name"></p>
                            <p class="text-xs text-gray-400" x-text="'v' + (tool.version || '?')"></p>
                        </div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                          :class="tool.status === 'healthy' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'"
                          x-text="tool.status === 'healthy' ? '健康' : '异常'"></span>
                </div>
                <p class="text-xs text-gray-400 mb-3 line-clamp-2" x-text="tool.description || '暂无描述'"></p>
                <div class="space-y-2 text-xs text-gray-400 mb-4">
                    <div class="flex justify-between">
                        <span>Endpoint</span>
                        <span class="text-gray-300 truncate max-w-[180px]" x-text="tool.endpoint"></span>
                    </div>
                    <div class="flex justify-between">
                        <span>最后检查</span>
                        <span class="text-gray-300" x-text="tool.last_health_check ? formatTime(tool.last_health_check) : '未检查'"></span>
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-3 border-t border-gray-700">
                    <button @click="checkHealth(tool)" :disabled="tool._checking"
                            class="flex-1 px-3 py-1.5 text-xs text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition disabled:opacity-50">
                        <i class="fas fa-heartbeat mr-1"></i>
                        <span x-text="tool._checking ? '检查中...' : '健康检查'"></span>
                    </button>
                    <a :href="tool.endpoint" target="_blank"
                       class="px-3 py-1.5 text-xs text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/10 rounded-lg transition">
                        <i class="fas fa-external-link-alt"></i>
                    </a>
                </div>
            </div>
        </template>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
function toolsPage() {
    return {
        tools: [],
        loading: true,
        checkingAll: false,

        async init() { await this.loadTools(); },

        async loadTools() {
            this.loading = true;
            try {
                const resp = await fetch('/api/auth/tools');
                const data = await resp.json();
                this.tools = (data.items || []).map(t => ({ ...t, _checking: false }));
            } catch (e) { console.error(e); } finally { this.loading = false; }
        },

        async checkHealth(tool) {
            tool._checking = true;
            try {
                const resp = await fetch(`/api/auth/tools/${tool.id}/health-check`, { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    tool.status = data.status;
                    tool.last_health_check = new Date().toISOString();
                }
            } catch (e) { console.error(e); } finally { tool._checking = false; }
        },

        async checkAllHealth() {
            this.checkingAll = true;
            for (const tool of this.tools) {
                await this.checkHealth(tool);
            }
            this.checkingAll = false;
        },

        formatTime(iso) {
            if (!iso) return '-';
            return new Date(iso).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
    };
}
</script>
{% endblock %}
